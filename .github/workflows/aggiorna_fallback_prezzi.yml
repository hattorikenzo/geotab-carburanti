name: Aggiorna fallback prezzi correnti

on:
  workflow_dispatch:
    inputs:
      station_ids:
        description: "ID impianti MIMIT separati da virgola (vuoto = impianti già presenti nel fallback)"
        required: false
        default: ""
  schedule:
    - cron: "47 8 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: aggiorna-fallback-prezzi
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Installa dipendenze
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Aggiorna fallback del trimestre non consolidato
        env:
          INPUT_STATION_IDS: ${{ github.event.inputs.station_ids || '' }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, json, gzip, time
          from pathlib import Path
          from datetime import datetime, timezone
          import requests
          from bs4 import BeautifulSoup

          ROOT=Path("data")
          FB=ROOT/"fallback"
          FB.mkdir(parents=True,exist_ok=True)

          # Trimestri già ufficialmente importati dal MIMIT.
          imported=set()
          sp=ROOT/"archivi_importati.json"
          if sp.exists():
              try:
                  imported=set(json.loads(sp.read_text(encoding="utf-8")).get("importati",[]))
              except Exception:
                  pass

          def quarter(dt):
              return f"{dt.year}-Q{(dt.month-1)//3+1}"

          current_q=quarter(datetime.now())
          if current_q in imported:
              print(f"{current_q} già consolidato MIMIT: fallback non necessario.")
              raise SystemExit(0)

          # ID richiesti manualmente + quelli che abbiamo già iniziato a seguire.
          ids=set()
          raw=os.environ.get("INPUT_STATION_IDS","")
          for x in re.split(r"[\s,;]+",raw.strip()):
              if x.isdigit(): ids.add(int(x))
          for p in FB.glob("*/*.json.gz"):
              try: ids.add(int(p.stem.split(".")[0]))
              except: pass

          if not ids:
              # SOLO COLLAUDO: se non viene fornito alcun ID usa l'impianto campione 48907.
              # Dopo la verifica questo fallback fisso verrà rimosso.
              ids.add(48907)
              print("Modalità collaudo: nessun station_ids ricevuto, uso automaticamente 48907.")

          session=requests.Session()
          session.headers.update({"User-Agent":"geotab-carburanti/1.0 (+GitHub Actions)"})

          def loadgz(p):
              if not p.exists(): return {"prezzi":{}}
              with gzip.open(p,"rt",encoding="utf-8") as f:return json.load(f)

          def savegz(p,obj):
              p.parent.mkdir(parents=True,exist_ok=True)
              tmp=p.with_suffix(p.suffix+".tmp")
              with gzip.open(tmp,"wt",encoding="utf-8",compresslevel=9) as f:
                  json.dump(obj,f,ensure_ascii=False,separators=(",",":"))
              tmp.replace(p)

          def parse_price(s):
              m=re.search(r"(\d+[,.]\d{3})\s*€?/?L?",s,re.I)
              return float(m.group(1).replace(",",".")) if m else None

          def parse_date(s):
              # Accetta dd/mm/yyyy, dd-mm-yyyy e date ISO visibili.
              for pat in (r"(\d{1,2})/(\d{1,2})/(\d{4})",
                          r"(\d{1,2})-(\d{1,2})-(\d{4})"):
                  m=re.search(pat,s)
                  if m:
                      d,mo,y=map(int,m.groups())
                      return f"{y:04d}-{mo:02d}-{d:02d}T00:00:00"
              m=re.search(r"(20\d\d)-(\d\d)-(\d\d)",s)
              return m.group(0)+"T00:00:00" if m else None

          # Benzina24 usa l'ID MIMIT come suffisso dell'URL.
          # Non conosciamo a priori lo slug; lo troviamo tramite la ricerca pubblica del sito.
          def discover_url(sid):
              q=f"https://www.google.com/search?q=site%3Abenzina24.it+%22-{sid}%2F%22"
              try:
                  r=session.get(q,timeout=30)
                  for u in re.findall(r'https?://www\.benzina24\.it/[^"&<>\s]+',r.text):
                      u=u.replace("&amp;","&")
                      if re.search(rf"-{sid}/?$",u): return u
              except Exception:
                  pass
              return None

          def extract(sid,url):
              r=session.get(url,timeout=45)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              text=soup.get_text(" ",strip=True)

              # Estrazione prudente: salviamo solo righe che contengono
              # contemporaneamente data + carburante + prezzo.
              records=[]
              candidates=[]
              for tag in soup.find_all(["tr","li","div","p"]):
                  t=" ".join(tag.stripped_strings)
                  if 15 <= len(t) <= 500: candidates.append(t)

              seen=set()
              for t in candidates:
                  dt=parse_date(t)
                  price=parse_price(t)
                  if not dt or price is None: continue
                  low=t.lower()
                  fuel=None
                  if "benzina" in low: fuel="Benzina"
                  elif "gasolio" in low or "diesel" in low: fuel="Gasolio"
                  elif "gpl" in low: fuel="GPL"
                  elif "metano" in low: fuel="Metano"
                  if not fuel: continue
                  selfv="1" if "self" in low else "0"
                  key=(fuel,selfv,dt,price)
                  if key in seen: continue
                  seen.add(key)
                  records.append(key)
              return records

          summary={"trimestre":current_q,"richiesti":len(ids),"aggiornati":0,
                   "record_aggiunti":0,"non_trovati":[],"errori":[]}

          for pos,sid in enumerate(sorted(ids),1):
              print(f"[{pos}/{len(ids)}] Impianto {sid}")
              try:
                  url=discover_url(sid)
                  if not url:
                      summary["non_trovati"].append(sid); continue
                  recs=extract(sid,url)
                  if not recs:
                      summary["non_trovati"].append(sid); continue

                  p=FB/f"{sid//1000:03d}"/f"{sid}.json.gz"
                  obj=loadgz(p)
                  obj["id"]=sid
                  obj["fonte"]="Benzina24"
                  obj["url"]=url
                  obj["trimestre"]=current_q
                  obj["aggiornato_il"]=datetime.now(timezone.utc).isoformat()
                  before=sum(len(v) for v in obj.setdefault("prezzi",{}).values())

                  for fuel,selfv,dt,price in recs:
                      # Il fallback serve solo al trimestre ancora non consolidato.
                      try:
                          d=datetime.fromisoformat(dt)
                          if quarter(d)!=current_q: continue
                      except: continue
                      k=f"{fuel}|{selfv}"
                      arr=obj["prezzi"].setdefault(k,[])
                      if [dt,price] not in arr: arr.append([dt,price])
                      arr.sort(key=lambda x:x[0])

                  after=sum(len(v) for v in obj["prezzi"].values())
                  if after>before:
                      savegz(p,obj)
                      summary["aggiornati"]+=1
                      summary["record_aggiunti"]+=after-before
              except Exception as e:
                  summary["errori"].append({"id":sid,"errore":str(e)})
              time.sleep(1.0)

          (FB/"manifest.json").write_text(json.dumps({
              "fonte":"Benzina24",
              "trimestre":current_q,
              "aggiornato_il":datetime.now(timezone.utc).isoformat(),
              "nota":"Fallback provvisorio; MIMIT trimestrale ha sempre priorità."
          },ensure_ascii=False,indent=2),encoding="utf-8")

          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Commit fallback
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fallback
          if git diff --cached --quiet; then
            echo "Nessuna modifica fallback."
          else
            git commit -m "Aggiorna fallback prezzi trimestre corrente"
            git push origin gh-pages
          fi

      - name: Avvia deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_site.yml --repo "$GITHUB_REPOSITORY" --ref main

name: Aggiorna prezzi MIMIT

on:
  workflow_dispatch:
  schedule:
    # UTC: 09:37 e 17:37 in ora legale; 08:37 e 16:37 in ora solare
    - cron: "37 7,15 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-prezzi-mimit-gh-pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout codice (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout dataset (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica e integra i prezzi senza cancellare lo storico
        working-directory: published
        run: python ../source/.github/scripts/aggiorna_prezzi.py

      - name: Pubblica solo i file modificati
        working-directory: published
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prezzi data/ultimo_aggiornamento_prezzi.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento da pubblicare"
            exit 0
          fi
          git commit -m "Aggiorna prezzi MIMIT e conserva storico"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

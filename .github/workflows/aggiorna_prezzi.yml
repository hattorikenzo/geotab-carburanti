name: Aggiorna prezzi MIMIT
on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: aggiorna-prezzi-mimit
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Scarica snapshot MIMIT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mimit
          download() {
            local remote="$1" localname="$2" url tmp attempt
            url="https://www.mimit.gov.it/images/exportCSV/${remote}"
            tmp="/tmp/mimit/${localname}.part"
            for attempt in 1 2 3 4 5; do
              echo "Download ${remote}: tentativo ${attempt}/5"
              rm -f "$tmp"
              if curl --fail --location --silent --show-error \
                --connect-timeout 90 --max-time 240 \
                --retry 2 --retry-delay 10 --retry-all-errors \
                --user-agent 'Mozilla/5.0 (compatible; MIMIT-dataset-updater/1.0)' \
                "$url" --output "$tmp"; then
                if python - "$tmp" <<'PY'
          import csv,sys
          from pathlib import Path
          p=Path(sys.argv[1]); lines=p.read_text(encoding='utf-8-sig',errors='replace').splitlines()
          header=next((i for i,s in enumerate(lines[:30]) if 'idimpianto' in s.lower()),None)
          if header is None: raise SystemExit('Intestazione idImpianto assente')
          delim='|' if lines[header].count('|')>=lines[header].count(';') else ';'
          reader=csv.DictReader(lines[header:],delimiter=delim)
          if not any(row.get('idImpianto') or row.get('idimpianto') for row in reader):
              raise SystemExit('Nessun impianto valido nel CSV')
          print(f'CSV valido: {p.stat().st_size} byte')
          PY
                then
                  mv "$tmp" "/tmp/mimit/${localname}"
                  return 0
                fi
              fi
              echo "Tentativo ${attempt} fallito"
              if (( attempt < 5 )); then sleep $((attempt * 20)); fi
            done
            echo "::error::Impossibile scaricare e validare ${remote}; dataset esistente invariato"
            return 1
          }
          download prezzo_alle_8.csv prezzi.csv
          download anagrafica_impianti_attivi.csv anagrafica.csv
      - name: Merge storico permanente
        shell: bash
        run: |
          python - <<'PY'
          import csv,gzip,json,math,tempfile,shutil
          from pathlib import Path
          from datetime import datetime,timezone
          ROOT=Path('data'); PR=ROOT/'prezzi'; GEO=ROOT/'geo'
          PR.mkdir(parents=True,exist_ok=True); ROOT.mkdir(parents=True,exist_ok=True)
          def setup(path):
            lines=Path(path).read_text(encoding='utf-8-sig',errors='replace').splitlines()
            for i,s in enumerate(lines[:30]):
              if 'idimpianto' in s.lower(): return i,('|' if s.count('|')>=s.count(';') else ';')
            raise RuntimeError('Header non trovato '+path)
          def rows(path):
            n,sep=setup(path)
            with open(path,encoding='utf-8-sig',errors='replace',newline='') as f:
              for _ in range(n): next(f,None)
              yield from csv.DictReader(f,delimiter=sep)
          def v(r,*names):
            d={str(k).strip().lower():(x or '').strip() for k,x in r.items() if k is not None}
            return next((d[n.lower()] for n in names if n.lower() in d),'')
          def ndt(s):
            for fmt in ('%d/%m/%Y %H:%M:%S','%d/%m/%Y %H:%M','%Y-%m-%d %H:%M:%S','%Y-%m-%dT%H:%M:%S'):
              try:return datetime.strptime(s.strip(),fmt).strftime('%Y-%m-%dT%H:%M:%S')
              except ValueError:pass
            return s.strip()[:19].replace(' ','T')
          def load(p):
            if not p.exists(): return {}
            with gzip.open(p,'rt',encoding='utf-8') as f:return json.load(f)
          def save(p,o):
            p.parent.mkdir(parents=True,exist_ok=True)
            t=p.with_suffix('.json.gz.tmp')
            with gzip.open(t,'wt',encoding='utf-8',compresslevel=9) as f:json.dump(o,f,ensure_ascii=False,separators=(',',':'))

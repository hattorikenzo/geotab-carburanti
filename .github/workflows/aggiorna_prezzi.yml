name: Aggiorna prezzi MIMIT e Mappa Carburanti

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7,15 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-prezzi-mimit-gh-pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout codice (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout dataset (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna MIMIT (storico ufficiale)
        id: mimit
        continue-on-error: true
        working-directory: published
        run: python ../source/.github/scripts/aggiorna_prezzi.py

      - name: Importa prezzi selezionati Mappa Carburanti (archivio separato)
        id: mappa
        continue-on-error: true
        working-directory: published
        run: python ../source/.github/scripts/importa_mappa_carburanti.py

      - name: Verifica che almeno una fonte sia riuscita
        if: steps.mimit.outcome != 'success' && steps.mappa.outcome != 'success'
        run: |
          echo "Entrambe le fonti non disponibili. Nessuna pubblicazione."
          exit 1

      - name: Pubblica solo i file modificati
        working-directory: published
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prezzi data/prezzi_mappa data/ultimo_aggiornamento_prezzi.json data/ultimo_aggiornamento_mappa.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento da pubblicare"
            exit 0
          fi
          git commit -m "Aggiorna MIMIT e prezzi alternativi separati"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages

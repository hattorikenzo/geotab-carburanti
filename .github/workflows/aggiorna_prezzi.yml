name: Aggiorna dati MIMIT giornalieri

on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: aggiorna-mimit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna prezzi e impianti
        shell: bash
        run: |
          cat > /tmp/update.py <<'PY'
          import csv, gzip, io, json, math, urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT=Path("repo/data")
          PRICE_URL="https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"
          STATION_URL="https://www.mimit.gov.it/images/exportCSV/anagrafica_impianti_attivi.csv"

          def download(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=180) as r:
                  return r.read()

          def clean(x): return (x or "").strip().lstrip("\ufeff")

          def reader(data):
              try: text=data.decode("utf-8-sig")
              except UnicodeDecodeError: text=data.decode("latin-1")
              lines=text.splitlines()
              sample="\n".join(lines[:12])
              delim="|" if sample.count("|")>sample.count(";") else ";"
              h=next((i for i,l in enumerate(lines[:30]) if "idimpianto" in l.lower()),None)
              if h is None: raise RuntimeError("Header idImpianto non trovato")
              return csv.DictReader(io.StringIO("\n".join(lines[h:])),delimiter=delim)

          def fmap(r): return {clean(x).lower():x for x in (r.fieldnames or []) if x}
          def val(row,fm,*names):
              for n in names:
                  k=fm.get(n.lower())
                  if k is not None and clean(row.get(k,"")):
                      return clean(row.get(k,""))
              return ""

          def selfval(x):
              return 1 if clean(x).lower() in ("1","true","t","yes","si","sì") else 0

          def parsedt(x):
              x=clean(x)
              for f in ("%d/%m/%Y %H:%M:%S","%d/%m/%Y %H:%M",
                        "%Y-%m-%d %H:%M:%S","%Y-%m-%d %H:%M",
                        "%Y-%m-%dT%H:%M:%S"):
                  try: return datetime.strptime(x,f)
                  except ValueError: pass
              return datetime.fromisoformat(x.replace("Z","+00:00")).replace(tzinfo=None)

          # ---------- PREZZI CORRENTI ----------
          pr=reader(download(PRICE_URL)); pf=fmap(pr)
          incoming=defaultdict(dict)
          rows=bad=0
          max_dt=None

          for row in pr:
              rows+=1
              try:
                  sid=int(val(row,pf,"idImpianto"))
                  fuel=val(row,pf,"descCarburante")
                  price=float(val(row,pf,"prezzo").replace(",","."))
                  sv=selfval(val(row,pf,"isSelf"))
                  dt=parsedt(val(row,pf,"dtComu"))
                  if sid<=0 or not fuel or price<=0: raise ValueError()
                  key=f"{fuel}|{sv}"
                  old=incoming[sid].get(key)
                  if old is None or dt>old[0]:
                      incoming[sid][key]=(dt,price)
                  if max_dt is None or dt>max_dt: max_dt=dt
              except Exception:
                  bad+=1

          changed_files=added_changes=ignored_old=0

          for sid,keys in incoming.items():
              bucket=f"{sid//1000:03d}"
              p=ROOT/"prezzi"/bucket/f"{sid}.json.gz"
              if p.exists():
                  with gzip.open(p,"rt",encoding="utf-8") as f:
                      obj=json.load(f)
              else:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  obj={"id":sid,"prezzi":{}}

              dirty=False
              for key,(dt,price) in keys.items():
                  hist=obj.setdefault("prezzi",{}).setdefault(key,[])
                  stamp=dt.strftime("%Y-%m-%dT%H:%M:%S")

                  if hist:
                      last_stamp=str(hist[-1][0])
                      last_price=float(hist[-1][1])
                      # Non inserire dati anteriori/uguali a quelli già archiviati.
                      if stamp<=last_stamp:
                          ignored_old+=1
                          continue
                      # Nessuna variazione: non serve una nuova riga.
                      if abs(last_price-price)<1e-9:
                          continue

                  hist.append([stamp,price])
                  added_changes+=1
                  dirty=True

              if dirty:
                  tmp=p.with_suffix(p.suffix+".tmp")
                  with gzip.open(tmp,"wt",encoding="utf-8",compresslevel=9) as f:
                      json.dump(obj,f,ensure_ascii=False,separators=(",",":"))
                  tmp.replace(p)
                  changed_files+=1

          # ---------- ANAGRAFICA / INDICE GEOGRAFICO ----------
          sr=reader(download(STATION_URL)); sf=fmap(sr)
          cells=defaultdict(list)
          station_count=station_bad=0

          for row in sr:
              try:
                  sid=int(val(row,sf,"idImpianto"))
                  lat=float(val(row,sf,"Latitudine").replace(",","."))
                  lon=float(val(row,sf,"Longitudine").replace(",","."))
                  if not (35<=lat<=48 and 6<=lon<=19): raise ValueError()
                  cells[(math.floor(lat/0.05),math.floor(lon/0.05))].append([
                      sid,round(lat,6),round(lon,6),
                      val(row,sf,"Gestore"),val(row,sf,"Bandiera"),
                      val(row,sf,"Tipo Impianto","TipoImpianto"),
                      val(row,sf,"Nome Impianto","NomeImpianto"),
                      val(row,sf,"Indirizzo"),val(row,sf,"Comune"),val(row,sf,"Provincia")
                  ])
                  station_count+=1
              except Exception:
                  station_bad+=1

          geo=ROOT/"geo"
          geo.mkdir(parents=True,exist_ok=True)
          for old in geo.glob("*.json"): old.unlink()
          for (cy,cx),items in cells.items():
              (geo/f"{cy}_{cx}.json").write_text(
                  json.dumps(items,ensure_ascii=False,separators=(",",":")),encoding="utf-8"
              )

          # ---------- MANIFEST ----------
          mp=ROOT/"manifest.json"
          manifest=json.loads(mp.read_text(encoding="utf-8")) if mp.exists() else {}
          manifest["version"]=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          manifest["ultimo_aggiornamento_prezzi"]=max_dt.strftime("%Y-%m-%dT%H:%M:%S") if max_dt else None
          manifest["impianti_attivi"]=station_count
          manifest["celle_geo"]=len(cells)
          mp.write_text(json.dumps(manifest,ensure_ascii=False,separators=(",",":")),encoding="utf-8")

          summary={
              "righe_csv_prezzi":rows,"righe_scartate":bad,
              "file_prezzi_modificati":changed_files,
              "variazioni_aggiunte":added_changes,
              "record_vecchi_ignorati":ignored_old,
              "ultimo_dt_comu":manifest["ultimo_aggiornamento_prezzi"],
              "impianti_attivi":station_count,"celle_geo":len(cells),
              "impianti_scartati":station_bad
          }
          Path("/tmp/update-summary.json").write_text(json.dumps(summary),encoding="utf-8")
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
          python /tmp/update.py

      - name: Commit dataset
        id: commit
        shell: bash
        working-directory: repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "Aggiornamento MIMIT $(date -u +%Y-%m-%d)"
            git push origin gh-pages
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Riepilogo
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open("/tmp/update-summary.json"))
          print("# Aggiornamento MIMIT")
          print("| Voce | Valore |"); print("|---|---:|")
          for k,n in [
            ("righe_csv_prezzi","Righe prezzi correnti"),
            ("variazioni_aggiunte","Variazioni aggiunte"),
            ("file_prezzi_modificati","File prezzi modificati"),
            ("record_vecchi_ignorati","Record vecchi ignorati"),
            ("impianti_attivi","Impianti attivi"),
            ("celle_geo","Celle geografiche")]:
              print(f"| {n} | {s[k]:,} |")
          print(f"| Ultimo dtComu | {s['ultimo_dt_comu']} |")
          PY

      - name: Avvia deploy sito
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy_site.yml --ref main

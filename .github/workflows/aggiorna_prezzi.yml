name: Aggiorna MIMIT via FRITZBox (prezzi, anagrafica, archivio)

on:
  workflow_dispatch:
  schedule:
    # Due controlli al giorno (UTC), orari locali variabili con ora legale
    - cron: '15 7,15 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: mimit-dataset-unificato
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout script main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout dati gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0

      - name: Installa WireGuard
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools >/dev/null

      - name: Avvia WireGuard solo per MIMIT
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$WG_CONFIG" || { echo 'Secret WIREGUARD_CONFIG mancante'; exit 1; }
          umask 077
          printf '%s\n' "$WG_CONFIG" > "$RUNNER_TEMP/wg-mimit.conf"
          sudo install -m 600 "$RUNNER_TEMP/wg-mimit.conf" /etc/wireguard/wg-mimit.conf
          rm -f "$RUNNER_TEMP/wg-mimit.conf"
          sudo sed -i -E '/^[[:space:]]*DNS[[:space:]]*=/d' /etc/wireguard/wg-mimit.conf
          sudo sed -i -E 's@^[[:space:]]*AllowedIPs[[:space:]]*=.*@AllowedIPs = 81.126.92.6/32@' /etc/wireguard/wg-mimit.conf
          sudo wg-quick up wg-mimit
          ip -4 route get 81.126.92.6
          # Un handshake puo iniziare solo dopo il primo pacchetto verso MIMIT.
          curl -4 -fLsS --noproxy '*' --resolve www.mimit.gov.it:443:81.126.92.6 \
            --connect-timeout 15 --max-time 30 \
            -o /dev/null https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv
          sudo wg show wg-mimit latest-handshakes | awk '$2 > 0 {ok=1} END {exit !ok}'
          echo 'VPN e HTTPS MIMIT verificati'

      - name: Aggiorna prezzi correnti, anagrafica e snapshot
        working-directory: published
        shell: bash
        run: |
          set -euo pipefail
          python3 ../source/.github/scripts/aggiorna_prezzi.py

      - name: Chiudi VPN e rimuovi credenziali temporanee
        if: always()
        run: |
          sudo wg-quick down wg-mimit 2>/dev/null || true
          sudo rm -f /etc/wireguard/wg-mimit.conf
          rm -f "$RUNNER_TEMP/wg-mimit.conf"

      - name: Pubblica aggiornamenti su gh-pages
        id: publish
        working-directory: published
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prezzi data/ultimo_aggiornamento_prezzi.json data/manifest.json mimit_snapshots
          if git diff --cached --quiet; then
            echo 'Nessuna modifica nei dati'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Aggiorna dati MIMIT ufficiali via WireGuard'
            git push origin HEAD:gh-pages
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Ricostruisci GitHub Pages con i dati nuovi
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_site.yml --repo "$GITHUB_REPOSITORY" --ref main

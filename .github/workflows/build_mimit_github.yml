name: Test dimensione storico MIMIT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  misura:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crea e avvia analizzatore
        shell: bash
        run: |
          cat > /tmp/test_mimit.py <<'PY'
          import csv, gzip, io, json, shutil, tarfile, urllib.request
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path

          OUT=Path("/tmp/mimit-out"); RAW=Path("/tmp/mimit-raw")
          OUT.mkdir(); RAW.mkdir()
          archives=[(y,q,f"https://opendatacarburanti.mise.gov.it/categorized/prezzo_alle_8/{y}/{y}_{q}_tr.tar.gz")
                    for y in range(2023,2027) for q in range(1,5)
                    if not (y==2026 and q>2)]
          last={}
          stations=defaultdict(lambda: defaultdict(list))
          totals={"csv":0,"rows":0,"valid":0,"bad":0,"changes":0}

          def clean(x): return (x or "").strip().lstrip("\ufeff")
          def pself(x):
              x=clean(x).lower()
              return 1 if x in ("1","true","t","yes","si","sì") else 0
          def pdate(x):
              x=clean(x)
              for f in ("%d/%m/%Y %H:%M:%S","%d/%m/%Y %H:%M",
                        "%Y-%m-%d %H:%M:%S","%Y-%m-%d %H:%M","%Y-%m-%dT%H:%M:%S"):
                  try: return datetime.strptime(x,f)
                  except ValueError: pass
              return datetime.fromisoformat(x.replace("Z","+00:00")).replace(tzinfo=None)

          def process(data,label):
              try: text=data.decode("utf-8-sig")
              except UnicodeDecodeError: text=data.decode("latin-1")
              lines=text.splitlines()
              delim="|" if "\n".join(lines[:8]).count("|") > "\n".join(lines[:8]).count(";") else ";"
              h=next((i for i,l in enumerate(lines[:30])
                      if "idimpianto" in l.lower() and "desccarburante" in l.lower() and "prezzo" in l.lower()),None)
              if h is None: return
              r=csv.DictReader(io.StringIO("\n".join(lines[h:])),delimiter=delim)
              fm={clean(x).lower():x for x in (r.fieldnames or []) if x}
              get=lambda row,n: row.get(fm.get(n.lower(),""),"")
              lr=lc=lb=0
              for row in r:
                  totals["rows"]+=1; lr+=1
                  try:
                      sid=int(clean(get(row,"idImpianto")))
                      fuel=clean(get(row,"descCarburante"))
                      price=float(clean(get(row,"prezzo")).replace(",","."))
                      selfv=pself(get(row,"isSelf"))
                      dt=pdate(get(row,"dtComu"))
                      if sid<=0 or not fuel or price<=0: raise ValueError()
                      totals["valid"]+=1
                      key=(sid,fuel,selfv)
                      if key not in last or abs(last[key]-price)>1e-9:
                          last[key]=price
                          stations[sid][f"{fuel}|{selfv}"].append([dt.strftime("%Y-%m-%dT%H:%M:%S"),price])
                          totals["changes"]+=1; lc+=1
                  except Exception:
                      totals["bad"]+=1; lb+=1
              totals["csv"]+=1
              print(f"{label}: righe={lr:,} cambi={lc:,} scarti={lb:,}")

          for y,q,url in archives:
              print(f"\n=== {y} Q{q} ===")
              p=RAW/f"{y}_{q}.tar.gz"
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=180) as r, open(p,"wb") as f: shutil.copyfileobj(r,f)
              print(f"Download {p.stat().st_size/1048576:.1f} MB")
              with tarfile.open(p,"r:gz") as t:
                  members=sorted([m for m in t.getmembers() if m.isfile() and m.name.lower().endswith(".csv")],
                                 key=lambda m:m.name)
                  for m in members:
                      f=t.extractfile(m)
                      if f: process(f.read(),Path(m.name).name)
              p.unlink()
              print(f"Progressivo: righe={totals['rows']:,}, cambi={totals['changes']:,}, impianti={len(stations):,}")

          rawsize=gzsize=files=0
          for sid in sorted(stations):
              b=json.dumps({"id":sid,"prezzi":stations[sid]},ensure_ascii=False,separators=(",",":")).encode()
              d=OUT/"prezzi"/f"{sid//1000:03d}"; d.mkdir(parents=True,exist_ok=True)
              p=d/f"{sid}.json.gz"
              with gzip.open(p,"wb",compresslevel=9) as z:z.write(b)
              rawsize+=len(b); gzsize+=p.stat().st_size; files+=1
          totals.update({"stations":len(stations),"files":files,"rawbytes":rawsize,"gzbytes":gzsize})
          Path("/tmp/mimit-summary.json").write_text(json.dumps(totals))
          print("\n========== RISULTATO ==========")
          print(f"CSV letti: {totals['csv']:,}")
          print(f"Righe totali: {totals['rows']:,}")
          print(f"Righe valide: {totals['valid']:,}")
          print(f"Righe scartate: {totals['bad']:,}")
          print(f"Cambi conservati: {totals['changes']:,}")
          print(f"Impianti: {len(stations):,}")
          print(f"File: {files:,}")
          print(f"JSON: {rawsize/1048576:.2f} MB")
          print(f"GZIP: {gzsize/1048576:.2f} MB")
          print("===============================")
          PY
          python /tmp/test_mimit.py
      - name: Riepilogo
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mimit-summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open("/tmp/mimit-summary.json"))
          print("# Test storico MIMIT 2023 → 2026 Q2")
          print("| Voce | Risultato |"); print("|---|---:|")
          for k,n in [("csv","CSV letti"),("rows","Righe totali"),("valid","Righe valide"),("bad","Righe scartate"),("changes","Cambi conservati"),("stations","Impianti"),("files","File")]:
              print(f"| {n} | {s[k]:,} |")
          print(f"| JSON | {s['rawbytes']/1048576:.2f} MB |")
          print(f"| GZIP | {s['gzbytes']/1048576:.2f} MB |")
          PY
          fi
      - name: Pulizia
        if: always()
        run: rm -rf /tmp/mimit-out /tmp/mimit-raw /tmp/test_mimit.py

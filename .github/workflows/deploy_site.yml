name: Deploy sito GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/deploy_site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dataset persistente
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dataset

      - name: Verifica file Add-In
        shell: bash
        run: |
          set -euo pipefail
          test -f main/index.html
          test -f main/costiCarburante.js
          test -f main/costiCarburante.css
          echo "OK: tutti i file Add-In sono presenti"

      - name: Prepara sito
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          test -d dataset/data
          cp -a dataset/data site/data

          cp main/index.html site/index.html
          cp main/costiCarburante.js site/costiCarburante.js
          cp main/costiCarburante.css site/costiCarburante.css

          find main -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -exec cp {} site/ \;

          touch site/.nojekyll

      - name: Verifica sito prima del deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FILE PUBBLICATI ==="
          find site -maxdepth 1 -type f -printf '%f\n' | sort

          test -s site/index.html
          test -s site/costiCarburante.js
          test -s site/costiCarburante.css

          grep -q 'costiCarburante.css' site/index.html
          grep -q 'costiCarburante.js' site/index.html
          grep -q 'window.geotab.addin.costiCarburante' site/costiCarburante.js

          test -f site/data/manifest.json
          test -f site/data/prezzi/048/48907.json.gz

          echo "OK: Add-In completo"
          echo "OK: dataset presente"

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

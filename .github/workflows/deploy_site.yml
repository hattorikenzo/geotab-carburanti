name: Deploy sito GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '.github/scripts/crea_report_aggiornamenti.py'
      - '.github/workflows/deploy_site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dataset persistente
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dataset

      - name: Prepara sito
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          test -d dataset/data
          cp -a dataset/data site/data
          cp main/index.html site/index.html
          cp main/costiCarburante.css site/costiCarburante.css
          if [ -f main/costiCarburante.js ]; then
            cp main/costiCarburante.js site/costiCarburante.js
          fi
          find main -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -exec cp '{}' site/ \;
          find main -maxdepth 1 -type f -name '*.css' ! -name 'costiCarburante.css' -exec cp '{}' site/ \;
          find main -maxdepth 1 -type f -name '*.js' ! -name 'costiCarburante.js' -exec cp '{}' site/ \;
          touch site/.nojekyll

      - name: Genera report ultime comunicazioni
        shell: bash
        run: |
          set -uo pipefail
          echo '=== SCRIPT ==='
          if [ ! -s main/.github/scripts/crea_report_aggiornamenti.py ]; then
            echo '::error::Script crea_report_aggiornamenti.py mancante o vuoto'
            exit 1
          fi
          python3 -m py_compile main/.github/scripts/crea_report_aggiornamenti.py || exit 1
          echo '=== DATASET ==='
          ls -ld site/data/prezzi site/data/prezzi_mappa || true
          echo '=== GENERAZIONE ==='
          python3 -u main/.github/scripts/crea_report_aggiornamenti.py
          rc=$?
          echo "Codice uscita Python: $rc"
          if [ "$rc" -ne 0 ]; then
            echo '::error::Lo script Python non ha completato la generazione del report'
            exit "$rc"
          fi
          if [ ! -s site/data/ultime_comunicazioni.json ]; then
            echo '::error::Report site/data/ultime_comunicazioni.json assente o vuoto'
            exit 1
          fi
          python3 -m json.tool site/data/ultime_comunicazioni.json > /dev/null || {
            echo '::error::Il report generato non contiene JSON valido'
            exit 1
          }
          ls -lh site/data/ultime_comunicazioni.json
          echo 'OK: report generato e JSON valido'

      - name: Verifica sito prima del deploy
        shell: bash
        run: |
          set -uo pipefail
          ERRORI=0
          verifica_file() {
            if [ -s "$1" ]; then
              echo "OK: $1"
            else
              echo "::error::File mancante o vuoto: $1"
              ERRORI=$((ERRORI + 1))
            fi
          }
          verifica_cartella() {
            if [ -d "$1" ]; then
              echo "OK: $1"
            else
              echo "::error::Cartella mancante: $1"
              ERRORI=$((ERRORI + 1))
            fi
          }
          verifica_testo() {
            if [ -f "$1" ] && grep -Fq "$2" "$1"; then
              echo "OK: contenuto '$2' in $1"
            else
              echo "::error::Contenuto '$2' non trovato in $1"
              ERRORI=$((ERRORI + 1))
            fi
          }
          verifica_file site/index.html
          verifica_file site/costiCarburante.css
          verifica_testo site/index.html 'costiCarburante.css'
          verifica_testo site/index.html 'window.geotab.addin.costiCarburante'
          verifica_file site/data/manifest.json
          verifica_file site/data/prezzi/048/48907.json.gz
          verifica_file site/data/ultimo_aggiornamento_mappa.json
          verifica_cartella site/data/prezzi_mappa
          verifica_file site/data/ultime_comunicazioni.json
          verifica_file site/verifica-aggiornamenti.html
          echo '=== File HTML nella radice ==='
          find site -maxdepth 1 -type f -printf '%f\n' | sort
          if [ "$ERRORI" -gt 0 ]; then
            echo "::error::Verifica fallita: $ERRORI problemi rilevati"
            exit 1
          fi
          echo 'OK: tutti i controlli superati'

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Pubblica su GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

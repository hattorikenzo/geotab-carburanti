name: Deploy sito GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '.github/scripts/crea_report_aggiornamenti.py'
      - '.github/workflows/deploy_site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dataset persistente
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dataset

      - name: Prepara sito
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          test -d dataset/data
          cp -a dataset/data site/data
          cp main/index.html site/index.html
          cp main/costiCarburante.css site/costiCarburante.css
          if [ -f main/costiCarburante.js ]; then
            cp main/costiCarburante.js site/costiCarburante.js
          fi
          find main -maxdepth 1 -type f -name '*.html' ! -name 'index.html' -exec cp '{}' site/ \;
          find main -maxdepth 1 -type f -name '*.css' ! -name 'costiCarburante.css' -exec cp '{}' site/ \;
          find main -maxdepth 1 -type f -name '*.js' ! -name 'costiCarburante.js' -exec cp '{}' site/ \;
          touch site/.nojekyll

      - name: Crea report ultime comunicazioni
        shell: bash
        run: |
          set -euo pipefail
          test -s main/.github/scripts/crea_report_aggiornamenti.py
          python3 main/.github/scripts/crea_report_aggiornamenti.py

      - name: Verifica sito prima del deploy
        shell: bash
        run: |
          set -uo pipefail
          ERRORI=0
          verifica_file() {
            if [ -s "$1" ]; then
              echo "OK: $1"
            else
              echo "::error::File mancante o vuoto: $1"
              ERRORI=$((ERRORI + 1))
            fi
          }
          verifica_cartella() {
            if [ -d "$1" ]; then
              echo "OK: $1"
            else
              echo "::error::Cartella mancante: $1"
              ERRORI=$((ERRORI + 1))
            fi
          }
          verifica_testo() {
            if [ -f "$1" ] && grep -Fq "$2" "$1"; then
              echo "OK: contenuto '$2' in $1"
            else
              echo "::error::Contenuto '$2' non trovato in $1"
              ERRORI=$((ERRORI + 1))
            fi
          }
          verifica_file site/index.html
          verifica_file site/costiCarburante.css
          verifica_testo site/index.html 'costiCarburante.css'
          verifica_testo site/index.html 'window.geotab.addin.costiCarburante'

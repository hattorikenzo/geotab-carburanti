name: Deploy sito GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/deploy_site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dataset persistente
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dataset

      - name: Verifica file Add-In
        shell: bash
        run: |
          set -euo pipefail

          test -s main/index.html
          test -s main/costiCarburante.css

          echo "OK: index.html presente"
          echo "OK: CSS presente"

      - name: Prepara sito
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          echo "Copio dataset..."
          test -d dataset/data
          cp -a dataset/data site/data

          echo "Copio Add-In..."
          cp main/index.html site/index.html
          cp main/costiCarburante.css site/costiCarburante.css

          # Manteniamo anche il JS esterno se presente,
          # anche se la versione standalone non lo utilizza.
          if [ -f main/costiCarburante.js ]; then
            cp main/costiCarburante.js site/costiCarburante.js
          fi

          # Copia eventuali pagine HTML di test
          find main \
            -maxdepth 1 \
            -type f \
            -name '*.html' \
            ! -name 'index.html' \
            -exec cp {} site/ \;

          touch site/.nojekyll

      - name: Verifica sito prima del deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FILE PUBBLICATI ==="
          find site -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "=== CONTROLLO ADD-IN ==="

          test -s site/index.html
          echo "OK: index.html"

          test -s site/costiCarburante.css
          echo "OK: costiCarburante.css"

          grep -q 'costiCarburante.css' site/index.html
          echo "OK: CSS collegato"

          # Versione standalone:
          # il codice dell'Add-In deve essere dentro index.html
          grep -q 'window.geotab.addin.costiCarburante' site/index.html
          echo "OK: codice MyGeotab presente in index.html"

          grep -q 'Add-In v27 caricato' site/index.html
          echo "OK: versione v27 standalone rilevata"

          echo
          echo "=== CONTROLLO DATASET ==="

          test -f site/data/manifest.json
          echo "OK: manifest.json"

          test -f site/data/prezzi/048/48907.json.gz
          echo "OK: dataset prezzi 48907"

          echo
          echo "================================"
          echo "OK: ADD-IN PRONTO PER IL DEPLOY"
          echo "================================"

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy sito GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/deploy_site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dataset persistente
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dataset

      - name: Prepara sito
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a dataset/data site/data

          # Pubblica automaticamente tutti gli HTML presenti nella root di main.
          find main -maxdepth 1 -type f -name '*.html' -exec cp {} site/ \;

          # Se non esiste ancora index.html, crea una pagina minima.
          if [ ! -f site/index.html ]; then
            cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Geotab Carburanti</title>
          </head>
          <body>
            <h1>Geotab Carburanti</h1>
            <p>Dataset MIMIT online.</p>
          </body>
          </html>
          HTML
          fi

          touch site/.nojekyll

          echo "Pagine HTML pubblicate:"
          find site -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sort

          test -f site/data/manifest.json
          test -f site/data/prezzi/048/48907.json.gz
          test -f site/test-48907-v3.html

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

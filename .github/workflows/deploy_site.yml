name: Deploy sito GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - ".github/workflows/deploy_site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT CODICE ADD-IN
      # ============================================================

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main


      # ============================================================
      # CHECKOUT DATASET MIMIT
      # ============================================================

      - name: Checkout dataset persistente
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: dataset


      # ============================================================
      # CONTROLLO FILE PRINCIPALI
      # ============================================================

      - name: Verifica file Add-In
        shell: bash
        run: |
          set -euo pipefail

          echo "=== CONTROLLO FILE SORGENTE ==="

          test -s main/index.html
          echo "OK: index.html"

          test -s main/costiCarburante.css
          echo "OK: costiCarburante.css"

          # costiCarburante.js non è obbligatorio:
          # la versione standalone contiene il JavaScript in index.html.

          if [ -s main/costiCarburante.js ]; then
            echo "INFO: costiCarburante.js presente"
          else
            echo "INFO: costiCarburante.js non presente - modalità standalone"
          fi


      # ============================================================
      # PREPARAZIONE CARTELLA GITHUB PAGES
      # ============================================================

      - name: Prepara sito
        shell: bash
        run: |
          set -euo pipefail

          echo "=== PREPARAZIONE SITO ==="

          rm -rf site
          mkdir -p site

          # --------------------------------------------------------
          # Dataset MIMIT
          # --------------------------------------------------------

          if [ ! -d dataset/data ]; then
            echo "ERRORE: cartella dataset/data non trovata"
            exit 1
          fi

          echo "Copio dataset MIMIT..."
          cp -a dataset/data site/data


          # --------------------------------------------------------
          # Add-In standalone
          # --------------------------------------------------------

          echo "Copio index.html..."
          cp main/index.html site/index.html

          echo "Copio CSS..."
          cp main/costiCarburante.css site/costiCarburante.css


          # --------------------------------------------------------
          # JS esterno opzionale
          # --------------------------------------------------------

          # Lo manteniamo se presente nel repository.
          # La versione standalone non dipende da questo file.

          if [ -f main/costiCarburante.js ]; then
            echo "Copio costiCarburante.js..."
            cp main/costiCarburante.js site/costiCarburante.js
          fi


          # --------------------------------------------------------
          # Eventuali pagine HTML di test
          # --------------------------------------------------------

          find main \
            -maxdepth 1 \
            -type f \
            -name '*.html' \
            ! -name 'index.html' \
            -exec cp {} site/ \;


          # --------------------------------------------------------
          # Disabilita elaborazione Jekyll
          # --------------------------------------------------------

          touch site/.nojekyll

          echo "Preparazione completata"


      # ============================================================
      # VERIFICA PRIMA DEL DEPLOY
      # ============================================================

      - name: Verifica sito prima del deploy
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================"
          echo "=== FILE PUBBLICATI ==="
          echo "================================"

          find site -maxdepth 1 -type f -printf '%f\n' | sort


          echo
          echo "================================"
          echo "=== CONTROLLO ADD-IN ==="
          echo "================================"

          test -s site/index.html
          echo "OK: index.html"

          test -s site/costiCarburante.css
          echo "OK: costiCarburante.css"


          # --------------------------------------------------------
          # Controllo CSS
          # --------------------------------------------------------

          if grep -q 'costiCarburante.css' site/index.html; then
            echo "OK: CSS collegato"
          else
            echo "ERRORE: riferimento costiCarburante.css non trovato"
            exit 1
          fi


          # --------------------------------------------------------
          # Controllo Add-In MyGeotab
          # --------------------------------------------------------

          # NON controlliamo il numero di versione.
          # In questo modo v28, v29, v30 ecc. non romperanno il deploy.

          if grep -q 'window.geotab.addin.costiCarburante' site/index.html; then
            echo "OK: codice MyGeotab standalone presente in index.html"
          else
            echo "ERRORE: codice MyGeotab non trovato in index.html"
            exit 1
          fi


          echo
          echo "================================"
          echo "=== CONTROLLO DATASET ==="
          echo "================================"


          # --------------------------------------------------------
          # Manifest
          # --------------------------------------------------------

          if [ -f site/data/manifest.json ]; then
            echo "OK: manifest.json"
          else
            echo "ERRORE: manifest.json non trovato"
            exit 1
          fi


          # --------------------------------------------------------
          # File prezzi di controllo
          # --------------------------------------------------------

          if [ -f site/data/prezzi/048/48907.json.gz ]; then
            echo "OK: dataset prezzi 48907"
          else
            echo "ERRORE: dataset prezzi 48907 non trovato"
            exit 1
          fi


          echo
          echo "================================"
          echo "OK: ADD-IN PRONTO PER IL DEPLOY"
          echo "================================"


      # ============================================================
      # CONFIGURAZIONE GITHUB PAGES
      # ============================================================

      - name: Configura Pages
        uses: actions/configure-pages@v5


      # ============================================================
      # CREAZIONE ARTIFACT
      # ============================================================

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site


  # ==============================================================
  # DEPLOY
  # ==============================================================

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

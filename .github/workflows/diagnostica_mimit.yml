
name: Diagnostica MIMIT - Porte e rete

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Verifica porte e percorso MIMIT
        shell: bash
        run: |
          set +e

          HOST="www.mimit.gov.it"
          IP="81.126.92.6"

          echo "=== 1. DNS ==="
          getent ahostsv4 "$HOST"

          echo "=== 2. PORTA 80 HTTP ==="
          timeout 7 bash -c \
            "echo > /dev/tcp/$IP/80"
          echo "Risultato porta 80: $?"

          echo "=== 3. PORTA 443 HTTPS ==="
          timeout 7 bash -c \
            "echo > /dev/tcp/$IP/443"
          echo "Risultato porta 443: $?"

          echo "=== 4. HTTP ==="
          curl -4 -I \
            --connect-timeout 6 \
            --max-time 8 \
            "http://$HOST/" 2>&1 | tail -15

          echo "=== 5. HTTPS ==="
          curl -4 -I \
            --connect-timeout 6 \
            --max-time 8 \
            "https://$HOST/" 2>&1 | tail -15

          echo "=== 6. PERCORSO DI RETE ==="
          if command -v tracepath >/dev/null; then
            timeout 12 tracepath -m 12 "$IP"
          elif command -v traceroute >/dev/null; then
            timeout 12 traceroute -m 12 -w 1 "$IP"
          else
            echo "Strumenti di tracciamento non installati"
          fi

          echo "=== DIAGNOSTICA TERMINATA ==="

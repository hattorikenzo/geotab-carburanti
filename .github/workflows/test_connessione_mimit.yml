
name: Test connessione MIMIT

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Diagnostica connessione MIMIT
        shell: bash
        run: |
          echo "=== DNS MIMIT ==="
          getent ahosts www.mimit.gov.it || true

          echo "=== TEST PORTA 80 HTTP ==="
          curl -4 -v -I \
            --connect-timeout 5 \
            --max-time 8 \
            http://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || true

          echo "=== TEST PORTA 8080 HTTP ==="
          curl -4 -v -I \
            --connect-timeout 5 \
            --max-time 8 \
            http://www.mimit.gov.it:8080/images/exportCSV/prezzo_alle_8.csv || true

          echo "=== TEST PORTA 8443 HTTPS ==="
          curl -4 -v -k -I \
            --connect-timeout 5 \
            --max-time 8 \
            https://www.mimit.gov.it:8443/images/exportCSV/prezzo_alle_8.csv || true

          echo "=== TEST HTTPS IPv4 PORTA 443 ==="
          curl -4 -v -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || true

          echo "=== TEST HTTPS IPv6 PORTA 443 ==="
          curl -6 -v -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || true

          echo "=== TEST DOWNLOAD CSV ==="
          curl -4 -L \
            --connect-timeout 10 \
            --max-time 30 \
            -o /tmp/prezzo_alle_8.csv \
            -w 'HTTP: %{http_code}\nDimensione: %{size_download} byte\n' \
            https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv || true

          echo "=== FINE TEST ==="

name: Aggiorna prezzi MIMIT correnti
on:
  workflow_dispatch:
  schedule:
    # Ogni giorno alle 09:15 italiane circa (07:15 UTC; in inverno 08:15 locali).
    - cron: "15 7 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-mimit-corrente
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dataset gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica prezzi correnti MIMIT
        shell: bash
        run: |
          set -euo pipefail
          URL="https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"
          DEST="/tmp/prezzo_alle_8.csv"
          for n in 1 2 3 4 5; do
            echo "Tentativo $n di 5..."
            rm -f "$DEST"
            if curl --fail --location --silent --show-error \
              --connect-timeout 30 --max-time 180 \
              --retry 2 --retry-delay 10 \
              --user-agent "Mozilla/5.0" \
              "$URL" -o "$DEST"; then
              if [ -s "$DEST" ] && grep -qi "idImpianto" "$DEST"; then
                echo "CSV MIMIT scaricato correttamente."
                ls -lh "$DEST"
                head -n 3 "$DEST"
                exit 0
              fi
              echo "CSV vuoto o formato non valido."
            fi
            rm -f "$DEST"
            if [ "$n" -lt 5 ]; then
              echo "Nuovo tentativo tra 20 secondi..."
              sleep 20
            fi
          done
          echo "::error::Download MIMIT fallito dopo 5 tentativi."
          exit 1

      - name: Aggiorna blocco corrente nei gzip
        shell: bash
        run: |
          python - <<'PY'
          import csv, gzip, io, json, re
          from datetime import datetime
          from pathlib import Path

          CSV=Path("/tmp/prezzo_alle_8.csv")
          ROOT=Path("data/prezzi")

          def decode(data):
              try: return data.decode("utf-8-sig")
              except UnicodeDecodeError: return data.decode("latin-1")

          def clean(x):
              return (x or "").strip().lstrip("\ufeff")

          def parse_dt(x):
              x=clean(x)
              for f in ("%d/%m/%Y %H:%M:%S","%d/%m/%Y %H:%M",
                        "%Y-%m-%d %H:%M:%S","%Y-%m-%d %H:%M",
                        "%Y-%m-%dT%H:%M:%S"):
                  try: return datetime.strptime(x,f)
                  except ValueError: pass
              return datetime.fromisoformat(x.replace("Z","+00:00")).replace(tzinfo=None)

          raw=CSV.read_bytes()
          text=decode(raw)
          lines=text.splitlines()
          header_i=next((i for i,l in enumerate(lines[:30]) if "idimpianto" in l.lower()),None)
          if header_i is None:
              raise SystemExit("Header idImpianto non trovato nel CSV MIMIT")


name: Aggiorna prezzi MIMIT correnti

on:
  workflow_dispatch:
  schedule:
    # 09:15 e 17:15 in estate
    # 08:15 e 16:15 in inverno
    - cron: '15 7,15 * * *'

permissions:
  contents: write

concurrency:
  group: aggiorna-mimit-corrente
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Attiva VPN WireGuard FRITZBox
        shell: bash
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          set -euo pipefail

          if [ -z "$WG_CONFIG" ]; then
            echo "Secret WIREGUARD_CONFIG mancante"
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools >/dev/null

          umask 077
          printf '%s\n' "$WG_CONFIG" > "$RUNNER_TEMP/wg-mimit.conf"

          sudo install -m 600 \
            "$RUNNER_TEMP/wg-mimit.conf" \
            /etc/wireguard/wg-mimit.conf

          rm -f "$RUNNER_TEMP/wg-mimit.conf"

          # Mantiene il DNS originale di GitHub Actions.
          sudo sed -i -E \
            '/^[[:space:]]*DNS[[:space:]]*=/d' \
            /etc/wireguard/wg-mimit.conf

          # Soltanto MIMIT attraversa la VPN.
          sudo sed -i -E \
            's@^[[:space:]]*AllowedIPs[[:space:]]*=.*@AllowedIPs = 81.126.92.6/32@' \
            /etc/wireguard/wg-mimit.conf

          sudo wg-quick up wg-mimit

          echo "=== Rotta verso MIMIT ==="
          ip -4 route get 81.126.92.6

          echo "=== Verifica handshake VPN ==="

          for attempt in 1 2 3 4 5; do
            sleep 2

            if sudo wg show wg-mimit latest-handshakes \
              | awk '$2 > 0 {ok=1} END {exit !ok}'; then
              echo "Handshake WireGuard riuscito"
              exit 0
            fi
          done

          echo "Handshake WireGuard non riuscito"
          exit 1

      
      - name: Diagnostica HTTPS MIMIT
        shell: bash
        run: |
          set -uo pipefail

          echo "=== Stato WireGuard ==="
          sudo wg show wg-mimit

          echo "=== Rotta verso MIMIT ==="
          ip -4 route get 81.126.92.6

          echo "=== IP pubblico in uscita ==="
          curl -4 -sS --max-time 15 \
            https://api.ipify.org || true
          echo

          echo "=== Test HTTPS MIMIT via VPN ==="
          curl -4 -v \
            --noproxy '*' \
            --resolve www.mimit.gov.it:443:81.126.92.6 \
            --connect-timeout 15 \
            --max-time 30 \
            -o /dev/null \
            -w "HTTP: %{http_code}\n" \
            https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv \
            2>&1 | tail -35

          echo "=== Diagnostica terminata ==="


      - name: Scarica e archivia prezzi verificati
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PYCODE'
          import csv
          import gzip
          import json
          import re
          import subprocess
          import urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path('mimit_snapshots')
          TMP = Path('/tmp/mimit_prices.csv')

          MIRROR = (
              'https://raw.githubusercontent.com/'
              'LucaDDDD/benzina-data/main/data/'
          )

          TODAY = datetime.now(
              ZoneInfo('Europe/Rome')
          ).date()

          ROOT.mkdir(parents=True, exist_ok=True)

          def download(url, path):
              path.unlink(missing_ok=True)

              command = [
                  'curl',
                  '-4',
                  '-fLsS',
                  '--connect-timeout', '15',
                  '--max-time', '60',
                  '--retry', '1',
                  '--retry-delay', '2',
                  '-A', 'Mozilla/5.0',
                  '-o', str(path)
              ]

              if 'www.mimit.gov.it' in url:
                  command.extend([
                      '--noproxy', '*',
                      '--resolve',
                      'www.mimit.gov.it:443:81.126.92.6'
                  ])

              command.append(url)

              subprocess.run(
                  command,
                  check=True,
                  timeout=140
              )

          def inspect_csv(path):
              if not path.is_file():
                  raise ValueError('CSV assente')

              if path.stat().st_size < 10000:
                  raise ValueError('CSV troppo piccolo')

              with path.open(
                  'r',
                  encoding='utf-8-sig',
                  errors='replace',
                  newline=''
              ) as stream:
                  lines = [
                      stream.readline()
                      for _ in range(30)
                  ]

              header = next(
                  (
                      line for line in lines
                      if 'idimpianto' in line.lower()
                  ),
                  ''
              )

              if not header:
                  raise ValueError(
                      'Intestazione idImpianto assente'
                  )

              separator = (
                  '|'
                  if header.count('|') > header.count(';')
                  else ';'
              )

              columns = {
                  column.strip().lower()
                  for column in next(
                      csv.reader(
                          [header],
                          delimiter=separator
                      )
                  )
              }

              required = {
                  'idimpianto',
                  'desccarburante',
                  'prezzo',
                  'isself',
                  'dtcomu'
              }

              if not required.issubset(columns):
                  raise ValueError(
                      f'Colonne mancanti: {required - columns}'
                  )

              match = re.search(
                  r'Estrazione\s+del\s+(\d{4}-\d{2}-\d{2})',
                  ''.join(lines),
                  re.I
              )

              return (
                  date.fromisoformat(match.group(1))
                  if match else None
              )

          def check_age(extraction):
              age = (TODAY - extraction).days

              if not 0 <= age <= 7:
                  raise ValueError(
                      f'Estrazione non recente: '
                      f'{extraction}, {age} giorni'
                  )

          def official():
              print(
                  'Download MIMIT ufficiale tramite FRITZBox',
                  flush=True
              )

              download(
                  'https://www.mimit.gov.it/'
                  'images/exportCSV/prezzo_alle_8.csv',
                  TMP
              )

              extraction = inspect_csv(TMP)

              if extraction is None:
                  raise ValueError(
                      'Data estrazione non verificabile'
                  )

              check_age(extraction)

              print(
                  f'MIMIT HTTP OK - '
                  f'{TMP.stat().st_size} byte',
                  flush=True
              )

              return 'MIMIT', extraction

          def github_fallback():
              print(
                  'Tentativo fonte alternativa GitHub',
                  flush=True
              )

              request = urllib.request.Request(
                  MIRROR + 'last_update.json',
                  headers={
                      'User-Agent': 'Mozilla/5.0'
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=15
              ) as response:
                  metadata = json.load(response)

              extraction = date.fromisoformat(
                  metadata['ultima_estrazione']
              )

              check_age(extraction)

              archive = Path(
                  '/tmp/mimit_fallback.csv.gz'
              )

              url = (
                  f'{MIRROR}'
                  f'{extraction:%Y}/'
                  f'{extraction:%m}/'
                  f'prezzo_alle_8-'
                  f'{extraction:%Y%m%d}.csv.gz'
              )

              download(url, archive)

              with gzip.open(
                  archive, 'rb'
              ) as source, TMP.open('wb') as target:
                  while chunk := source.read(
                      1024 * 1024
                  ):
                      target.write(chunk)

              csv_extraction = inspect_csv(TMP)

              if (
                  csv_extraction is not None
                  and csv_extraction != extraction
              ):
                  raise ValueError(
                      'Data CSV diversa dal metadata'
                  )

              return 'GitHub mirror', extraction

          failures = []
          selected = None

          for source in (
              official,
              github_fallback
          ):
              try:
                  selected = source()
                  break
              except Exception as exc:
                  message = (
                      f'{source.__name__}: {exc}'
                  )
                  failures.append(message)
                  print(
                      f'AVVISO: {message}',
                      flush=True
                  )

          if selected is None:
              raise SystemExit(
                  'Nessuna fonte valida disponibile. '
                  'Archivio invariato. '
                  + ' | '.join(failures)
              )

          source_name, extraction = selected

          destination = (
              ROOT
              / f'{extraction:%Y}'
              / f'{extraction:%m}'
              / (
                  f'prezzo_alle_8-'
                  f'{extraction:%Y%m%d}.csv.gz'
              )
          )

          destination.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with TMP.open('rb') as source:
              with gzip.open(
                  destination,
                  'wb',
                  compresslevel=6
              ) as target:
                  while chunk := source.read(
                      1024 * 1024
                  ):
                      target.write(chunk)

          metadata = {
              'fonte': source_name,
              'ultima_estrazione': (
                  extraction.isoformat()
              ),
              'scaricato_utc': (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              ),
              'file': str(destination)
          }

          (
              ROOT / 'last_update.json'
          ).write_text(
              json.dumps(
                  metadata,
                  indent=2,
                  ensure_ascii=False
              ) + '\n',
              encoding='utf-8'
          )

          print(
              f'OK: {source_name}, '
              f'estrazione {extraction}, '
              f'archivio {destination}',
              flush=True
          )
          PYCODE

      - name: Chiudi VPN prima della pubblicazione
        if: always()
        shell: bash
        run: |
          sudo wg-quick down wg-mimit \
            2>/dev/null || true

          sudo rm -f \
            /etc/wireguard/wg-mimit.conf

          rm -f \
            "$RUNNER_TEMP/wg-mimit.conf"

      - name: Pubblica archivio su gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            'github-actions[bot]'

          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add mimit_snapshots/

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
          else
            git commit -m \
              'Aggiorna archivio prezzi MIMIT verificati'

            git push origin HEAD:gh-pages
          fi

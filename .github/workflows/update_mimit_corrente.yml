
      - name: Scarica prezzi correnti MIMIT con fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import gzip
          import json
          import shutil
          import subprocess
          import urllib.request
          from datetime import date
          from pathlib import Path

          DEST = Path("/tmp/prezzo_alle_8.csv")
          MIMIT = "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"
          MIRROR = "https://raw.githubusercontent.com/LucaDDDD/benzina-data/main/data/"
          DEST.unlink(missing_ok=True)

          def download(url, path):
              subprocess.run([
                  "curl", "-4", "-fLsS",
                  "--connect-timeout", "12",
                  "--max-time", "90",
                  "--retry", "1",
                  "--retry-delay", "5",
                  "-A", "Mozilla/5.0",
                  url, "-o", str(path)
              ], check=True)

          def validate(path):
              if not path.exists() or path.stat().st_size < 10000:
                  raise ValueError("CSV assente o troppo piccolo")
              with path.open(
                  encoding="utf-8-sig",
                  errors="replace"
              ) as f:
                  lines = [next(f, "") for _ in range(30)]
              header = next(
                  (s for s in lines if "idimpianto" in s.lower()),
                  ""
              )
              sep = "|" if header.count("|") >= header.count(";") else ";"
              columns = {
                  c.strip().lower()
                  for c in next(csv.reader([header], delimiter=sep), [])
              }
              if not {
                  "idimpianto", "desccarburante",
                  "prezzo", "isself", "dtcomu"
              }.issubset(columns):
                  raise ValueError("Intestazione CSV non valida")

          try:
              print("Tentativo download MIMIT...", flush=True)
              download(MIMIT, DEST)
              validate(DEST)
              print("Download MIMIT riuscito", flush=True)

          except Exception as exc:
              print("MIMIT non raggiungibile:", exc, flush=True)
              DEST.unlink(missing_ok=True)
              print("Attivazione fallback GitHub...", flush=True)

              try:
                  req = urllib.request.Request(
                      MIRROR + "last_update.json",
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as r:
                      meta = json.load(r)

                  d = date.fromisoformat(meta["ultima_estrazione"])
                  age = (date.today() - d).days

                  if not 0 <= age <= 7:
                      raise ValueError(
                          f"Archivio troppo vecchio: {d}"
                      )

                  url = (
                      f"{MIRROR}{d:%Y}/{d:%m}/"
                      f"prezzo_alle_8-{d:%Y%m%d}.csv.gz"
                  )
                  archive = Path("/tmp/prezzi_fallback.csv.gz")
                  download(url, archive)

                  with gzip.open(archive, "rb") as source:
                      with DEST.open("wb") as target:
                          shutil.copyfileobj(source, target)

                  validate(DEST)
                  archive.unlink(missing_ok=True)
                  print(
                      f"Fallback GitHub riuscito. "
                      f"Estrazione: {d}",
                      flush=True
                  )

              except Exception as fallback_error:
                  DEST.unlink(missing_ok=True)
                  raise SystemExit(
                      "Nessuna fonte valida disponibile. "
                      "Storico preservato. "
                      + str(fallback_error)
                  )
          PY

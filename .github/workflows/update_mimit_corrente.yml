name: Aggiorna prezzi MIMIT correnti

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: aggiorna-mimit-corrente
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recupera CSV con fallback e controlli di formato
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import csv
          import gzip
          import json
          import re
          import shutil
          import subprocess
          import urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path

          dest = Path('/tmp/prezzo_alle_8.csv')
          meta_file = Path('/tmp/mimit_source.json')
          mirror = 'https://raw.githubusercontent.com/LucaDDDD/benzina-data/main/data/'
          required = {'idimpianto', 'desccarburante', 'prezzo', 'isself', 'dtcomu'}
          dest.unlink(missing_ok=True)

          def download(url, path):
              path.unlink(missing_ok=True)
              subprocess.run([
                  'curl', '-4', '-fLsS', '--connect-timeout', '8',
                  '--max-time', '35', '--retry', '0',
                  '--user-agent', 'Mozilla/5.0',
                  '-o', str(path), url
              ], check=True, timeout=40)

          def validate(path):
              if not path.is_file() or path.stat().st_size < 10000:
                  raise ValueError('CSV assente o troppo piccolo')
              with path.open('r', encoding='utf-8-sig', errors='replace', newline='') as f:
                  first_lines = [f.readline() for _ in range(8)]
              header = next((line.strip() for line in first_lines
                             if 'idimpianto' in line.lower()), None)
              if not header:
                  raise ValueError('Intestazione idImpianto assente')
              sep = '|' if header.count('|') >= header.count(';') else ';'
              columns = {x.strip().lower() for x in next(csv.reader([header], delimiter=sep))}
              if not required.issubset(columns):
                  raise ValueError('Colonne incompatibili con MIMIT: ' + repr(sorted(columns)))
              # Controllo di plausibilita' sulle prime righe di dati.
              with path.open('r', encoding='utf-8-sig', errors='replace', newline='') as f:
                  rows = list(csv.reader((line for line in f if line.strip() and
                               not line.lower().startswith('estrazione del')),
                               delimiter=sep))[:15]
              if len(rows) < 3:
                  raise ValueError('CSV privo di dati sufficienti')
              return first_lines

          def declared_date(lines):
              for line in lines[:4]:
                  match = re.search(r'estrazione\s+del\s+(\d{4}-\d{2}-\d{2})', line, re.I)
                  if match:
                      return date.fromisoformat(match.group(1)).isoformat()
              return None

          attempts = [
              ('MIMIT', 'https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv'),
              ('Mappa Carburanti Italia', 'https://mappacarburanti.it/data/stazioni-italia.csv'),
          ]
          chosen = None
          extraction = None
          for label, url in attempts:

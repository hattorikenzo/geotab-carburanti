name: Aggiorna prezzi MIMIT correnti

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: write

concurrency:
  group: aggiorna-mimit-corrente
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dataset gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica prezzi MIMIT o fallback verificato
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import csv, gzip, json, shutil, subprocess, urllib.request
          from datetime import date
          from pathlib import Path

          dest = Path('/tmp/prezzo_alle_8.csv')
          mirror = 'https://raw.githubusercontent.com/LucaDDDD/benzina-data/main/data/'
          dest.unlink(missing_ok=True)

          def download(url, output):
              subprocess.run(['curl', '-4', '-fLsS', '--connect-timeout', '12',
                              '--max-time', '75', '--retry', '1', '--retry-delay', '5',
                              '--user-agent', 'Mozilla/5.0', url, '-o', str(output)], check=True)

          def validate(path):
              if not path.is_file() or path.stat().st_size < 10000:
                  raise ValueError('CSV assente o troppo piccolo')
              with path.open(encoding='utf-8-sig', errors='replace') as f:
                  head = [next(f, '') for _ in range(30)]
              header = next((line for line in head if 'idimpianto' in line.lower()), '')
              sep = '|' if header.count('|') >= header.count(';') else ';'
              columns = {c.strip().lower() for c in next(csv.reader([header], delimiter=sep), [])}
              required = {'idimpianto', 'desccarburante', 'prezzo', 'isself', 'dtcomu'}
              if not required.issubset(columns):
                  raise ValueError('Intestazione CSV non valida: ' + str(columns))

          source = None
          extraction = None
          try:
              print('Tentativo download diretto MIMIT', flush=True)
              download('https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv', dest)
              validate(dest)
              source = 'MIMIT'
          except Exception as error:
              print('MIMIT non raggiungibile:', error, flush=True)
              dest.unlink(missing_ok=True)
              try:
                  print('Attivo fallback GitHub', flush=True)
                  request = urllib.request.Request(mirror + 'last_update.json',
                                                   headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      metadata = json.load(response)
                  d = date.fromisoformat(metadata['ultima_estrazione'])
                  age = (date.today() - d).days
                  if not 0 <= age <= 7:
                      raise ValueError(f'Fallback non recente: {d}, {age} giorni')
                  archive = Path('/tmp/prezzo_alle_8.csv.gz')
                  url = f'{mirror}{d:%Y}/{d:%m}/prezzo_alle_8-{d:%Y%m%d}.csv.gz'
                  download(url, archive)
                  with gzip.open(archive, 'rb') as src, dest.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
                  validate(dest)
                  archive.unlink(missing_ok=True)
                  source = 'GitHub benzina-data'
                  extraction = d.isoformat()
              except Exception as fallback_error:
                  dest.unlink(missing_ok=True)
                  raise SystemExit('Nessuna fonte valida: storico lasciato invariato. ' + str(fallback_error))
          print('Fonte:', source, 'Estrazione:', extraction or 'non verificata', flush=True)
          PYCODE

      - name: Aggiorna storico nei gzip senza cancellare dati

name: Aggiorna prezzi MIMIT correnti

on:
  workflow_dispatch:
  schedule:
    # UTC: 09:15/17:15 in estate; 08:15/16:15 in inverno
    - cron: '15 7,15 * * *'

permissions:
  contents: write

concurrency:
  group: aggiorna-mimit-corrente
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica e archivia prezzi verificati
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import csv
          import gzip
          import json
          import re
          import subprocess
          import urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path('mimit_snapshots')
          TMP = Path('/tmp/mimit_prices.csv')
          MIRROR = 'https://raw.githubusercontent.com/LucaDDDD/benzina-data/main/data/'
          TODAY = datetime.now(ZoneInfo('Europe/Rome')).date()
          ROOT.mkdir(parents=True, exist_ok=True)

          def download(url, path):
              subprocess.run([
                  'curl', '-4', '-fLsS', '--connect-timeout', '8',
                  '--max-time', '35', '--retry', '0',
                  '-A', 'Mozilla/5.0', '-o', str(path), url
              ], check=True, timeout=42)

          def inspect_csv(path):
              if not path.is_file() or path.stat().st_size < 10000:
                  raise ValueError('CSV assente o troppo piccolo')
              with path.open('r', encoding='utf-8-sig', errors='replace', newline='') as stream:
                  lines = [stream.readline() for _ in range(30)]
              header = next((line for line in lines if 'idimpianto' in line.lower()), '')
              if not header:
                  raise ValueError('Intestazione idImpianto assente')
              separator = '|' if header.count('|') > header.count(';') else ';'
              columns = {column.strip().lower() for column in next(csv.reader([header], delimiter=separator))}
              required = {'idimpianto', 'desccarburante', 'prezzo', 'isself', 'dtcomu'}
              if not required.issubset(columns):
                  raise ValueError(f'Colonne mancanti: {required - columns}')
              match = re.search(r'Estrazione\s+del\s+(\d{4}-\d{2}-\d{2})', ''.join(lines), re.I)
              return date.fromisoformat(match.group(1)) if match else None

          def check_age(extraction):
              age = (TODAY - extraction).days
              if not 0 <= age <= 7:
                  raise ValueError(f'Estrazione non recente: {extraction}, {age} giorni')

          def official():
              download('https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv', TMP)
              extraction = inspect_csv(TMP)
              if extraction is None:
                  raise ValueError('MIMIT: data estrazione non verificabile')
              check_age(extraction)
              return 'MIMIT', extraction

          def github_fallback():
              request = urllib.request.Request(MIRROR + 'last_update.json', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  metadata = json.load(response)
              extraction = date.fromisoformat(metadata['ultima_estrazione'])
              check_age(extraction)
              archive = Path('/tmp/mimit_fallback.csv.gz')
              url = f'{MIRROR}{extraction:%Y}/{extraction:%m}/prezzo_alle_8-{extraction:%Y%m%d}.csv.gz'
              download(url, archive)
              with gzip.open(archive, 'rb') as source, TMP.open('wb') as target:
                  while chunk := source.read(1024 * 1024):
                      target.write(chunk)
              csv_extraction = inspect_csv(TMP)
              if csv_extraction is not None and csv_extraction != extraction:
                  raise ValueError(f'Data CSV {csv_extraction} diversa dal metadata {extraction}')
              return 'GitHub mirror', extraction

          failures = []
          selected = None
          for source in (official, github_fallback):
              try:
                  selected = source()
                  break
              except Exception as exc:
                  failures.append(f'{source.__name__}: {exc}')
                  print(f'AVVISO: {failures[-1]}', flush=True)

          if selected is None:
              raise SystemExit('Nessuna fonte valida disponibile; archivio invariato. ' + ' | '.join(failures))

          source_name, extraction = selected
          destination = ROOT / f'{extraction:%Y}' / f'{extraction:%m}' / f'prezzo_alle_8-{extraction:%Y%m%d}.csv.gz'
          destination.parent.mkdir(parents=True, exist_ok=True)
          with TMP.open('rb') as source, gzip.open(destination, 'wb', compresslevel=6) as target:
              while chunk := source.read(1024 * 1024):
                  target.write(chunk)
          # Conserva la data di estrazione e la provenienza del CSV.
          metadata = {
              'fonte': source_name,
              'ultima_estrazione': extraction.isoformat(),
              'scaricato_utc': datetime.now(timezone.utc).isoformat(),
              'file': str(destination)
          }
          (ROOT / 'last_update.json').write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'OK: {source_name}, estrazione {extraction}, archivio {destination}')
          PYCODE

      - name: Pubblica archivio su gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mimit_snapshots/
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da pubblicare'
          else
            git commit -m 'Aggiorna archivio prezzi MIMIT verificati'
            git push origin HEAD:gh-pages
          fi

name: Aggiorna prezzi MIMIT correnti

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: aggiorna-mimit-corrente
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download e verifica fonte
        shell: bash
        run: |
          set -euo pipefail
          python -c '
          import csv, gzip, json, subprocess, tempfile, urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          dest = Path("/tmp/prezzo_alle_8.csv")
          dest.unlink(missing_ok=True)
          today = datetime.now(ZoneInfo("Europe/Rome")).date()

          def fetch(url, output):
              subprocess.run(["curl", "-4", "-fLsS", "--connect-timeout", "8", "--max-time", "35", "--retry", "0", "-A", "Mozilla/5.0", "-o", str(output), url], check=True, timeout=40)

          def verify(path):
              if not path.is_file() or path.stat().st_size < 10000:
                  raise ValueError("CSV mancante o troppo piccolo")
              with path.open(encoding="utf-8-sig", errors="replace") as f:
                  first = [next(f, "") for _ in range(30)]
              header = next((line for line in first if "idimpianto" in line.lower()), None)
              if not header:
                  raise ValueError("Intestazione idImpianto assente")
              sep = "|" if header.count("|") > header.count(";") else ";"
              cols = {c.strip().lower() for c in next(csv.reader([header], delimiter=sep))}
              needed = {"idimpianto", "desccarburante", "prezzo", "isself", "dtcomu"}
              if not needed.issubset(cols):
                  raise ValueError("Colonne incompatibili: " + str(cols))
              return first

          def extraction_from_header(lines):
              import re
              for line in lines[:10]:
                  match = re.search(r"Estrazione\s+del\s+(\d{4}-\d{2}-\d{2})", line, re.I)
                  if match:
                      return date.fromisoformat(match.group(1))
              return None

          errors = []
          selected = None
          extraction = None
          candidates = [
              ("MIMIT", "https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv"),
              ("Mappa Carburanti", "https://mappacarburanti.it/data/stazioni-italia.csv"),
          ]
          for label, url in candidates:
              try:
                  print("Tentativo:", label, flush=True)
                  dest.unlink(missing_ok=True)
                  fetch(url, dest)
                  lines = verify(dest)
                  extracted = extraction_from_header(lines)
                  if extracted is None:
                      raise ValueError("Data di estrazione non verificabile nel CSV")
                  age = (today - extracted).days
                  if not 0 <= age <= 7:
                      raise ValueError("Estrazione non recente: " + str(extracted))
                  selected, extraction = label, extracted
                  break
              except Exception as exc:
                  errors.append(label + ": " + str(exc))
                  print("Fonte scartata:", errors[-1], flush=True)

          if selected is None:

name: Verifica prezzi Mappa Carburanti (sola lettura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout script dal ramo main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout dati pubblicati dal ramo gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          persist-credentials: false

      - name: Scarica CSV e confronta con storico MIMIT
        shell: bash
        run: |
          set -euo pipefail
          python3 source/.github/scripts/verifica_prezzi_mappa.py

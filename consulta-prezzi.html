<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta prezzi MIMIT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#263238;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
h1{margin:0 0 6px;color:#123f73;font-size:25px}
.sub{color:#687784;margin-bottom:18px}
.card{background:#fff;border:1px solid #dfe4e8;border-radius:12px;padding:17px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
label{display:block;font-size:12px;font-weight:700;color:#607080;margin-bottom:6px;text-transform:uppercase}
input,select{width:100%;height:42px;border:1px solid #cfd8dc;border-radius:7px;padding:0 11px;background:#fff;font-size:14px}
button{height:42px;border:0;border-radius:7px;padding:0 18px;background:#1565c0;color:white;font-weight:700;cursor:pointer}
button:hover{background:#0d57aa} button:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:12px;color:#607080;min-height:20px}.err{color:#b3261e}.ok{color:#176b37}
.results{margin-top:14px;max-height:340px;overflow:auto;border:1px solid #e2e7ea;border-radius:8px}
.station{padding:11px 13px;border-bottom:1px solid #edf0f2;cursor:pointer}.station:last-child{border-bottom:0}
.station:hover{background:#f5f9ff}.station.sel{background:#e8f2ff}
.station b{color:#123f73}.muted{color:#71808c;font-size:12px;margin-top:3px}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{padding:10px 9px;border-bottom:1px solid #e5e9ec;text-align:left}
th{background:#f6f8fa;color:#52616b;font-size:12px;text-transform:uppercase}
.num{text-align:right}.price{font-size:19px;font-weight:700;color:#123f73}
.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#eef3f7;font-size:11px}
.hidden{display:none}
@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Consulta prezzi MIMIT</h1>
  <div class="sub">Ricerca impianto per comune e nome, quindi consulta lo storico prezzi salvato nel dataset GitHub Pages.</div>

  <div class="card">
    <div class="grid">
      <div>
        <label for="comune">Comune</label>
        <input id="comune" placeholder="Es. Ferrara">
      </div>
      <div>
        <label for="nome">Nome / gestore / bandiera / indirizzo</label>
        <input id="nome" placeholder="Es. CONAD, Q8, Via Eridano...">
      </div>
      <button id="cerca">Cerca impianti</button>
    </div>
    <div id="searchStatus" class="status">Inserisci almeno il comune.</div>
    <div id="results" class="results hidden"></div>
  </div>

  <div id="priceCard" class="card hidden">
    <div id="selectedStation"></div>
    <div class="grid2" style="margin-top:15px">
      <div>
        <label for="data">Data</label>
        <input id="data" type="date">
      </div>
      <div>
        <label for="carburante">Carburante</label>
        <select id="carburante"><option value="">Tutti i carburanti</option></select>
      </div>
      <div>
        <label for="modalita">Modalità</label>
        <select id="modalita">
          <option value="">Self + servito</option>
          <option value="1">Self service</option>
          <option value="0">Servito</option>
        </select>
      </div>
      <button id="prezzo">Cerca prezzo</button>
    </div>
    <div id="priceStatus" class="status"></div>
    <div id="priceResult"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const DATA_BASE="https://hattorikenzo.github.io/geotab-carburanti/data";
const GRID=.05;
let stations=[], selected=null, priceData=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const dec=(n,d=3)=>new Intl.NumberFormat("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);

function today(){
 const d=new Date(), y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),g=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${g}`;
}
$("data").value=today(); $("data").max=today();

async function fetchJson(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok) throw new Error("HTTP "+r.status);
 return r.json();
}
async function fetchGzip(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok) throw new Error("HTTP "+r.status);
 if(!("DecompressionStream" in window)) throw new Error("Il browser non supporta la decompressione gzip.");
 const ds=new DecompressionStream("gzip");
 return JSON.parse(await new Response(r.body.pipeThrough(ds)).text());
}
async function geocodeComune(comune){
 const u="https://nominatim.openstreetmap.org/search?format=json&countrycodes=it&limit=1&q="+encodeURIComponent(comune+", Italia");
 const r=await fetch(u,{headers:{"Accept":"application/json"}});
 if(!r.ok) throw new Error("Geocodifica comune non disponibile");
 const a=await r.json();
 if(!a.length) throw new Error("Comune non trovato");
 return {lat:Number(a[0].lat),lon:Number(a[0].lon),display:a[0].display_name};
}
function stationObj(r){
 return {
  raw:r,id:Number(r[0]),lat:Number(r[1]),lon:Number(r[2]),
  gestore:r[3]||"",bandiera:r[4]||"",extra:r[5]||"",nome:r[6]||"",
  indirizzo:r[7]||"",comune:r[8]||"",provincia:r[9]||""
 };
}
async function loadArea(lat,lon,radius=5){
 const cy=Math.floor(lat/GRID),cx=Math.floor(lon/GRID), jobs=[];
 for(let dy=-radius;dy<=radius;dy++) for(let dx=-radius;dx<=radius;dx++){
   jobs.push(fetchJson(`${DATA_BASE}/geo/${cy+dy}_${cx+dx}.json`).catch(()=>[]));
 }
 const arrays=await Promise.all(jobs), map=new Map();
 for(const a of arrays) for(const r of a){const s=stationObj(r);if(Number.isFinite(s.id))map.set(s.id,s)}
 return [...map.values()];
}
function renderStations(list){
 const box=$("results"); box.innerHTML="";
 if(!list.length){box.classList.add("hidden");return}
 box.classList.remove("hidden");
 for(const s of list.slice(0,300)){
   const d=document.createElement("div"); d.className="station";
   d.innerHTML=`<b>${esc(s.gestore||s.bandiera||s.nome||"Impianto MIMIT")}</b> <span class="badge">ID ${s.id}</span>
   <div class="muted">${esc([s.bandiera,s.nome].filter(Boolean).join(" — "))}</div>
   <div class="muted">${esc([s.indirizzo,s.comune,s.provincia].filter(Boolean).join(" — "))}</div>`;
   d.onclick=()=>selectStation(s,d); box.appendChild(d);
 }
}
async function search(){
 const comune=$("comune").value.trim(), q=norm($("nome").value);
 if(!comune){$("searchStatus").innerHTML='<span class="err">Inserisci il comune.</span>';return}
 $("cerca").disabled=true;$("searchStatus").textContent="Ricerca del comune e caricamento impianti...";
 $("results").classList.add("hidden");
 try{
   const geo=await geocodeComune(comune);
   const all=await loadArea(geo.lat,geo.lon,5);
   const c=norm(comune);
   let list=all.filter(s=>norm(s.comune).includes(c));
   if(!list.length) list=all; // utile se la denominazione MIMIT differisce leggermente
   if(q) list=list.filter(s=>norm([s.gestore,s.bandiera,s.nome,s.indirizzo,s.comune,s.provincia].join(" ")).includes(q));
   list.sort((a,b)=>(a.gestore||a.bandiera||a.nome).localeCompare(b.gestore||b.bandiera||b.nome,"it"));
   stations=list;
   $("searchStatus").innerHTML=list.length?`<span class="ok">${list.length} impianti trovati.</span> Seleziona quello desiderato.`:'<span class="err">Nessun impianto trovato. Prova solo con il comune o con un termine più breve.</span>';
   renderStations(list);
 }catch(e){$("searchStatus").innerHTML='<span class="err">'+esc(e.message)+'</span>'}
 finally{$("cerca").disabled=false}
}
async function selectStation(s,el){
 selected=s; priceData=null;
 document.querySelectorAll(".station").forEach(x=>x.classList.remove("sel")); el.classList.add("sel");
 $("priceCard").classList.remove("hidden");
 $("selectedStation").innerHTML=`<b style="font-size:18px;color:#123f73">${esc(s.gestore||s.bandiera||s.nome||"Impianto MIMIT")}</b>
 <span class="badge">ID MIMIT ${s.id}</span>
 <div class="muted">${esc([s.bandiera,s.nome,s.indirizzo,s.comune,s.provincia].filter(Boolean).join(" — "))}</div>`;
 $("priceStatus").textContent="Caricamento archivio prezzi dell'impianto...";
 $("priceResult").innerHTML="";
 try{
   const bucket=String(Math.floor(s.id/1000)).padStart(3,"0");
   priceData=await fetchGzip(`${DATA_BASE}/prezzi/${bucket}/${s.id}.json.gz`);
   const fuels=[...new Set(Object.keys(priceData.prezzi||{}).map(k=>k.split("|")[0]))].sort((a,b)=>a.localeCompare(b,"it"));
   $("carburante").innerHTML='<option value="">Tutti i carburanti</option>'+fuels.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join("");
   $("priceStatus").innerHTML=`<span class="ok">Archivio caricato: ${fuels.length} tipologie carburante.</span>`;
 }catch(e){
   $("priceStatus").innerHTML='<span class="err">Archivio prezzi non disponibile per questo impianto.</span>';
 }
}
function searchPrice(){
 if(!selected||!priceData)return;
 const day=$("data").value, fuel=$("carburante").value, mode=$("modalita").value;
 if(!day){$("priceStatus").innerHTML='<span class="err">Seleziona una data.</span>';return}
 const rows=[];
 for(const [key,arr] of Object.entries(priceData.prezzi||{})){
   const p=key.split("|"), name=p[0], self=String(p[1]??"");
   if(fuel&&name!==fuel)continue;
   if(mode!==""&&self!==mode)continue;
   let exact=[],previous=[];
   for(const r of arr||[]){
     const dt=String(r[0]||""), d=dt.slice(0,10);
     if(d===day)exact.push(r);
     if(d<=day)previous.push(r);
   }
   const pool=exact.length?exact:previous;
   pool.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
   if(pool.length) rows.push({fuel:name,self,date:String(pool[0][0]),price:Number(pool[0][1]),source:pool[0][2]||"MIMIT",exact:exact.length>0});
 }
 rows.sort((a,b)=>a.fuel.localeCompare(b.fuel,"it")||b.self.localeCompare(a.self));
 if(!rows.length){
   $("priceResult").innerHTML='<div class="status err">Nessun prezzo disponibile alla data selezionata.</div>';return;
 }
 $("priceResult").innerHTML=`<table><thead><tr><th>Carburante</th><th>Modalità</th><th>Prezzo</th><th>Comunicazione MIMIT</th><th>Risultato</th></tr></thead><tbody>${
 rows.map(r=>`<tr><td><b>${esc(r.fuel)}</b></td><td>${r.self==="1"?"Self service":r.self==="0"?"Servito":esc(r.self)}</td>
 <td class="price">${dec(r.price,3)} €/L</td><td>${esc(r.date.replace("T"," ").replace("Z",""))}</td>
 <td>${r.exact?'<span class="ok">Comunicazione del giorno</span>':'Ultimo prezzo precedente valido'}</td></tr>`).join("")
 }</tbody></table>`;
 $("priceStatus").textContent=`Prezzi disponibili al ${day}.`;
}

$("cerca").onclick=search;
$("prezzo").onclick=searchPrice;
$("comune").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("nome").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
})();
</script>
</body>
</html>

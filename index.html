</table></div></div></div></div><script>

(function(){
 const s=document.getElementById("status");
 if(s) s.textContent="Add-In v57 riconciliazione FillUp caricato. Attesa inizializzazione MyGeotab…";
})();

(function(){
            "use strict";
            const DATA_BASE="https://hattorikenzo.github.io/geotab-carburanti/data";
            const GRID=.05, MAX_STATION_METERS=500;
            let coverage=null;
            let api=null, vehicles=[];
            let lastItems=[], lastVehicle=null, vehiclePhotoUrl="";

            const $=id=>document.getElementById(id);
            const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
            const money=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n);
            const dec=(n,d=2)=>new Intl.NumberFormat("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);



            function localYmd(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
            function setDefaultDates(){
             let to=new Date(),from=new Date(to);from.setDate(from.getDate()-30);
             $("dateFrom").value=localYmd(from);$("dateTo").value=localYmd(to);
             $("dateTo").max=localYmd(to);
            }
            function call(method,params){return new Promise((resolve,reject)=>{try{api.call(method,params||{},resolve,e=>reject(new Error(typeof e==="string"?e:JSON.stringify(e))))}catch(e){reject(e)}})}
            function get(type,search,resultsLimit){return call("Get",{typeName:type,search:search||{},resultsLimit:resultsLimit||50000})}
            function dtLocal(v){let d=new Date(v);return isNaN(d)?String(v):d.toLocaleString("it-IT")}
            function isoNoZone(v){let d=new Date(v);if(isNaN(d))return String(v).slice(0,19);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,19)}
            function hav(lat1,lon1,lat2,lon2){const R=6371000,p=Math.PI/180,a=Math.sin((lat2-lat1)*p/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin((lon2-lon1)*p/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
            function normalizeFuel(v){
             // HEV / Hybrid: per MIMIT il carburante da ricercare è quello termico.
             // Prima riconosciamo esplicitamente gli ibridi diesel, poi gli HEV/ibridi benzina.
             let raw=String(v||"").trim();
             let s=raw.toLowerCase();
             if(/(diesel|gasolio).*(hev|hybrid|ibrid)|(hev|hybrid|ibrid).*(diesel|gasolio)/i.test(raw))return "Gasolio";
             if(/\bhev\b|hybrid|ibrid/i.test(raw))return "Benzina";
             if(/diesel|gasolio/.test(s))return "Gasolio";
             if(/sp95|gasoline|petrol|benzina/.test(s))return "Benzina";
             if(/lpg|gpl/.test(s))return "GPL";
             if(/cng|metano/.test(s))return "Metano";
             return ""
            }
            function fillCoords(f){let lat=f.latitude,lon=f.longitude;if(f.location){if(lat==null)lat=f.location.y;if(lon==null)lon=f.location.x}lat=Number(lat);lon=Number(lon);return Number.isFinite(lat)&&Number.isFinite(lon)?[lat,lon]:null}
            function litersOf(f){for(const k of ["volume","liters","fuelVolume","totalFuel"]){let n=Number(f[k]);if(Number.isFinite(n)&&n>0)return n}return 0}
            const jsonCache=new Map(),gzipCache=new Map();
            async function fetchJson(url){
             if(jsonCache.has(url))return jsonCache.get(url);
             let p=fetch(url,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status+" "+url);return r.json()});
             jsonCache.set(url,p);
             try{return await p}catch(e){jsonCache.delete(url);throw e}
            }
            async function fetchGzip(url){
             if(gzipCache.has(url))return gzipCache.get(url);
             let p=(async()=>{let r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status+" "+url);if(!("DecompressionStream" in window))throw new Error("Browser senza supporto gzip DecompressionStream");let b=await r.blob(),ds=new DecompressionStream("gzip");return JSON.parse(await new Response(b.stream().pipeThrough(ds)).text())})();
             gzipCache.set(url,p);
             try{return await p}catch(e){gzipCache.delete(url);throw e}
            }
            function quarterOf(v){let d=new Date(v);if(isNaN(d))return "";let y=d.getFullYear(),q=Math.floor(d.getMonth()/3)+1;return `${y}-Q${q}`}
            async function loadCoverage(){
             try{
              let [m,a]=await Promise.all([fetchJson(`${DATA_BASE}/manifest.json`).catch(()=>({})),fetchJson(`${DATA_BASE}/archivi_importati.json`).catch(()=>({}))]);
              let imported=Array.isArray(a)?a:[...(a.importati||[]),...(a.trimestri_importati||[])];
              let qs=new Set([...(m.trimestri_mimit||[]),...imported]);
              coverage={manifest:m,quarters:qs};
             }catch(e){coverage={manifest:{},quarters:new Set()}}
            }
            function quarterIsOfficial(v){return !!(coverage&&coverage.quarters&&coverage.quarters.has(quarterOf(v)))}
            async function nearestStation(lat,lon){
             let cy=Math.floor(lat/GRID),cx=Math.floor(lon/GRID),all=[];
             await Promise.all(Array.from({length:9},(_,i)=>{let dy=Math.floor(i/3)-1,dx=i%3-1;return fetchJson(`${DATA_BASE}/geo/${cy+dy}_${cx+dx}.json`).then(a=>all.push(...a)).catch(()=>{})}));
             let best=null;for(const s of all){let d=hav(lat,lon,Number(s[1]),Number(s[2]));if(!best||d<best.distance)best={raw:s,distance:d}}
             return best&&best.distance<=MAX_STATION_METERS?best:null;
            }
        async function nearestStationConfirmedRefuel(lat,lon){
         // Rifornimento già confermato dall'aumento del volume carburante:
         // restituisce l'impianto MIMIT più vicino senza cutoff di 500 metri.
         let cy=Math.floor(lat/GRID),cx=Math.floor(lon/GRID);
         for(const radius of [1,2,3,5]){
          let all=[],jobs=[];
          for(let dy=-radius;dy<=radius;dy++){
           for(let dx=-radius;dx<=radius;dx++){
            jobs.push(fetchJson(`${DATA_BASE}/geo/${cy+dy}_${cx+dx}.json`).then(a=>all.push(...a)).catch(()=>{}));
           }
          }
          await Promise.all(jobs);
          let best=null;
          for(const s of all){
           let d=hav(lat,lon,Number(s[1]),Number(s[2]));
           if(!best||d<best.distance)best={raw:s,distance:d};
          }
          if(best)return best;
         }
         return null;
        }

            async function priceFromFile(url,fuel,fillDate,source,mode){
             let o=await fetchGzip(url);
             let fillDay=localYmd(new Date(fillDate));
             let rows=[];

             for(const [key,arr] of Object.entries(o.prezzi||{})){
              let p=key.split("|"),name=p[0],self=String(p[1]??"");
              if(normalizeFuel(name)!==fuel)continue;
              if(mode!==undefined&&mode!==null&&self!==String(mode))continue;

              let exact=[],previous=[];
              for(const r of arr||[]){
               let dt=String(r[0]||""),day=dt.slice(0,10);
               if(day===fillDay)exact.push(r);
               if(day<=fillDay)previous.push(r);
              }
              let pool=exact.length?exact:previous;
              pool.sort((x,y)=>String(y[0]).localeCompare(String(x[0])));
              if(pool.length)rows.push({
               date:String(pool[0][0]),price:Number(pool[0][1]),self,
               source:pool[0][2]||source,exact:exact.length>0
              });
             }
             rows.sort((x,y)=>String(y.date).localeCompare(String(x.date)));
             return rows.length?rows[0]:null;
            }

            async function priceFromDailyFallback(url,fuel,fillDate){
             let o=await fetchGzip(url),arr=(o.giornalieri||{})[fuel]||[];
             let fillDay=String(fillDate).slice(0,10),best=null;
             for(const r of arr){let day=String(r[0]);if(day<=fillDay&&(!best||day>best.date))best={date:day,price:Number(r[1]),source:"MIMIT - snapshot giornaliero"}}
             return best;
            }
            async function historicalPrice(stationId,fuel,fillDate){
             let bucket=String(Math.floor(stationId/1000)).padStart(3,"0");
             let mimitUrl=`${DATA_BASE}/prezzi/${bucket}/${stationId}.json.gz`;

             let [selfPrice,servedPrice]=await Promise.all([
              priceFromFile(mimitUrl,fuel,fillDate,"MIMIT","1").catch(()=>null),
              priceFromFile(mimitUrl,fuel,fillDate,"MIMIT","0").catch(()=>null)
             ]);

             let primary=selfPrice||servedPrice;
             if(primary)return {
              ...primary,
              official:quarterIsOfficial(fillDate),
              selfPrice:selfPrice,
              servedPrice:servedPrice
             };

             let fb=await priceFromDailyFallback(
              `${DATA_BASE}/fallback_mensile/${bucket}/${stationId}.json.gz`,
              fuel,fillDate
             ).catch(()=>null);
             return fb?{...fb,official:false,selfPrice:null,servedPrice:null}:null;
            }

            function supplier(s){let r=s.raw,gestore=r[3]||"",bandiera=r[4]||"",nome=r[6]||"";return {gestore,bandiera,nome,address:[r[7],r[8],r[9]].filter(Boolean).join(" — ")}}
            function allVehicleText(v){
             // Legge ricorsivamente TUTTI i valori testuali/numerici restituiti
             // da MyGeotab per il veicolo, compresi eventuali metadati di
             // "Marca, modello, anno, tipo di veicolo".
             let out=[],seen=new Set();
             function walk(x,depth){
              if(x==null||depth>8)return;
              if(typeof x==="string"||typeof x==="number"||typeof x==="boolean"){out.push(String(x));return}
              if(typeof x!=="object"||seen.has(x))return;
              seen.add(x);
              if(Array.isArray(x)){for(const y of x)walk(y,depth+1);return}
              for(const [k,y] of Object.entries(x)){out.push(String(k));walk(y,depth+1)}
             }
             walk(v,0);
             return out.join(" ");
            }

            async function fuelForVehicle(v){
             // REGOLA PRIORITARIA: se MyGeotab restituisce HEV in QUALSIASI dato
             // identificativo del veicolo (es. "Kia Niro (HEV) 2019"), per il
             // prezzo MIMIT usiamo BENZINA. Un riferimento esplicito a Diesel/Gasolio
             // insieme a HEV resta invece Gasolio.
             let fullText=allVehicleText(v);
             if(/(diesel|gasolio).*(\bhev\b|hybrid|ibrid)|(\bhev\b|hybrid|ibrid).*(diesel|gasolio)/i.test(fullText))return "Gasolio";
             if(/\bhev\b/i.test(fullText))return "Benzina";

             let f=normalizeFuel(fullText);
             if(f)return f;

             // Se il testo HEV non è incluso nell'oggetto Device, interroghiamo il VIN
             // e usiamo i campi FuelType/ElectrificationLevel come fallback generale.
             let vin=vinOf(v);
             if(vin){
              try{
               let info=await decodeVin(v);
               if(info){
                let vinText=[info.fuelTypePrimary,info.fuelTypeSecondary,info.electrificationLevel,info.make,info.model].filter(Boolean).join(" ");
                if(/(diesel|gasolio).*(\bhev\b|hybrid|ibrid)|(\bhev\b|hybrid|ibrid).*(diesel|gasolio)/i.test(vinText))return "Gasolio";
                if(/\bhev\b|hybrid|ibrid/i.test(vinText))return "Benzina";
                f=normalizeFuel(vinText);
                if(f)return f;
               }
              }catch(e){console.warn("Identificazione carburante da VIN non disponibile:",e)}
             }
             // v50: fallback locale per veicoli noti.
             // Nessuna chiamata Device aggiuntiva: non interferisce con l'avvio MyGeotab.
             let knownVin=vinOf(v);
             if(knownVin.startsWith("UU15SDAG35"))return "Benzina"; // Dacia Sandero
             if(knownVin.startsWith("VR3USHNKK"))return "Benzina"; // Peugeot 2008

             // Nel database geotabfleet_eu il veicolo condiviso è denominato DaciaM&M.
             // Se il VIN non è incluso nell'oggetto Device restituito all'Add-In,
             // il nome costituisce l'ultimo fallback.
             let deviceName=String(v&&v.name||"").trim().toLowerCase();
             if(deviceName==="dacia m&m"||deviceName==="daciam&m")return "Benzina";

             return "";
            }

            const IGNITION_DIAG_ID="DiagnosticIgnitionId";
            const RECOVERY_AFTER_HOURS=48;
            let fuelVolumeDiagnosticId=null;
            let diagnosticMetaLoaded=false;

            function normText(v){
             return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
            }

            async function resolveFuelVolumeDiagnostic(){
             // ID ufficiale usato dalla vista MyGeotab:
             // LIVELLO DEL CARBURANTE (VOLUME)
             fuelVolumeDiagnosticId="DiagnosticFuelUnitsId";
             diagnosticMetaLoaded=true;
             return fuelVolumeDiagnosticId;
            }

            async function statusWindow(deviceId,diagnosticId,from,to){
             if(!diagnosticId)return [];
             let rows=await get("StatusData",{
              deviceSearch:{id:deviceId},
              diagnosticSearch:{id:diagnosticId},
              fromDate:from.toISOString(),
              toDate:to.toISOString()
             },50000);
             return (rows||[]).map(r=>({
              id:r.id||"",
              date:r.dateTime,
              data:Number(r.data),
              diagnosticId:r.diagnostic&&r.diagnostic.id?r.diagnostic.id:""
             })).filter(r=>r.date&&Number.isFinite(r.data))
               .sort((a,b)=>new Date(a.date)-new Date(b.date));
            }

            function realSamples(rows){
             // Con DeviceSearch + DiagnosticSearch Geotab può creare valori interpolati
             // ai limiti dell'intervallo: i record reali hanno id.
             let stored=(rows||[]).filter(r=>r.id);
             return stored.length?stored:(rows||[]);
            }

            const REFUEL_STABLE_MINUTES=2;
            const REFUEL_STABLE_TOLERANCE_L=1.0;
            
            function findVolumeRise(samples,fillLiters){
             let s=realSamples(samples);
             let best=null;

             for(let i=1;i<s.length;i++){
              let a=s[i-1],b=s[i];
              let rise=Number(b.data)-Number(a.data);
              if(!Number.isFinite(rise)||rise<=0)continue;

              // Il salto deve essere almeno 3 L per eliminare piccole oscillazioni.
              if(rise<3)continue;

              let candidate={
               date:b.date,
               before:Number(a.data),
               after:Number(b.data),
               rise:rise
              };

              // Nel periodo successivo al FillUp prendiamo il primo vero salto
              // significativo: è il passaggio dal livello prima del rifornimento
              // al nuovo livello misurato.
              if(!best||new Date(candidate.date)<new Date(best.date))best=candidate;
             }
             return best;
            }

            function ignitionIsOn(v){return Number(v)>0}

            async function firstGpsAfter(deviceId,dateValue,minutes=8){
         let d=new Date(dateValue);
         if(!deviceId||isNaN(d))return null;
         try{
          let rows=await get("LogRecord",{
           deviceSearch:{id:deviceId},
           fromDate:new Date(d.getTime()-60*1000).toISOString(),
           toDate:new Date(d.getTime()+minutes*60000).toISOString()
          },5000);
          let valid=(rows||[]).map(r=>({
           date:r.dateTime,dt:new Date(r.dateTime),
           lat:Number(r.latitude),lon:Number(r.longitude),speed:Number(r.speed)
          })).filter(r=>!isNaN(r.dt)&&Number.isFinite(r.lat)&&Number.isFinite(r.lon))
            .sort((x,y)=>Math.abs(x.dt-d)-Math.abs(y.dt-d));
          return valid[0]||null;
         }catch(e){return {error:e&&e.message?e.message:String(e)}}
        }

        async function recoveryFromNextIgnition(f,deviceId){
             let originalDate=f.dateTime||f.date||f.timestamp,base=new Date(originalDate);
             let result={
              used:false,originalDate,volumeDiagnosticId:"",volumeSamples:[],
              volumeRise:null,ignitionSamples:[],ignition:null,gps:null,station:null,message:""
             };
             if(!deviceId||isNaN(base)){result.message="Data o veicolo non valido";return result}

             let to=new Date(base.getTime()+RECOVERY_AFTER_HOURS*3600000);
             try{
              let volumeId=await resolveFuelVolumeDiagnostic();
              result.volumeDiagnosticId=volumeId||"";
              if(!volumeId){
               result.message="Diagnostica 'Livello del carburante (Volume) (L)' non trovata.";
               return result;
              }

              result.volumeSamples=await statusWindow(deviceId,volumeId,base,to);
              result.volumeRise=findVolumeRise(result.volumeSamples,litersOf(f));

              // Cerchiamo i giri chiave successivi al FillUp. Se il volume aumenta
              // soltanto alla successiva accensione, la posizione utile è quella
              // registrata dopo quell'Ignition ON.
              result.ignitionSamples=await statusWindow(deviceId,IGNITION_DIAG_ID,base,to).catch(()=>[]);
              let ons=realSamples(result.ignitionSamples).filter(x=>ignitionIsOn(x.data));

              let candidates=[];
              if(result.volumeRise){
               let vr=new Date(result.volumeRise.date);
               // Prima scelta: ignition ON più vicino all'aumento volume,
               // da 6 ore prima fino a 30 minuti dopo.
               candidates=ons.filter(x=>{
                let t=new Date(x.date);
                return t>=new Date(vr.getTime()-6*3600000)&&t<=new Date(vr.getTime()+30*60000);
               }).sort((a,b)=>Math.abs(new Date(a.date)-vr)-Math.abs(new Date(b.date)-vr));
              }
              // Fallback: successivi giri chiave in ordine cronologico.
              if(!candidates.length)candidates=ons.sort((a,b)=>new Date(a.date)-new Date(b.date));

              // Se Ignition non è disponibile, il campione volume crescente diventa
              // il riferimento temporale per cercare il primo GPS successivo.
              if(!candidates.length&&result.volumeRise)candidates=[{date:result.volumeRise.date,data:1,proxy:true}];

              for(const ign of candidates){
               let gps=await firstGpsAfter(deviceId,ign.date,8);
               if(!gps||gps.error)continue;
               let station=await nearestStationConfirmedRefuel(gps.lat,gps.lon);
               if(station){
                result.ignition=ign;
                result.gps=gps;
                result.station=station;
                result.used=true;
                return result;
               }
              }

              if(result.volumeRise)result.message="Aumento volume trovato, ma nessun impianto MIMIT disponibile nella griglia dati attorno alla posizione rilevata.";
              else result.message="Nessun delta positivo del volume carburante trovato nelle 48 ore successive.";
              return result;
             }catch(e){
              result.message="Errore recupero rifornimento: "+(e&&e.message?e.message:String(e));
              return result;
             }
            }

            const FUEL_VOLUME_DIAGNOSTIC_ID="DiagnosticFuelUnitsId";
            const FUEL_PERCENT_DIAGNOSTIC_ID="DiagnosticFuelLevelId";

            async function fuelPercentRiseFromMeasuredStatus(f,deviceId){
             let fillDate=f.dateTime||f.date||f.timestamp;
             if(!fillDate)return null;
             let base=new Date(fillDate);
             let from=new Date(base.getTime()-30*60*1000);
             let to=new Date(base.getTime()+90*60*1000);
             let rows=await statusWindow(deviceId,FUEL_PERCENT_DIAGNOSTIC_ID,from,to).catch(()=>[]);
             let s=realSamples(rows).sort((a,b)=>new Date(a.date)-new Date(b.date));
             if(s.length<2)return null;
             let fillMs=base.getTime();
             let before=s.filter(x=>new Date(x.date).getTime()<=fillMs);
             let after=s.filter(x=>new Date(x.date).getTime()>fillMs);
             if(!before.length||!after.length)return null;
             let pre=before[before.length-1];
             let after30=after.filter(x=>new Date(x.date).getTime()<=fillMs+30*60*1000);
             if(!after30.length)after30=after.slice(0,1);
             let peak=after30.reduce((best,x)=>Number(x.data)>Number(best.data)?x:best,after30[0]);
             let rise=Number(peak.data)-Number(pre.data);
             if(!Number.isFinite(rise)||rise<=0)return null;
             return {before:Number(pre.data),after:Number(peak.data),rise,date:peak.date,diagnosticId:FUEL_PERCENT_DIAGNOSTIC_ID};
            }

            async function fuelRiseFromMeasuredStatus(f,deviceId){
             let fillDate=f.dateTime||f.date||f.timestamp;
             if(!fillDate)return null;

             let base=new Date(fillDate);
             let fillMs=base.getTime();

             // v55 REGOLA GENERALE DiagnosticFuelUnitsId:
             // - base = minimo reale nei 15 minuti precedenti al FillUp
             // - dopo = primo campione successivo con aumento >= 3 L
             // - finestra di recupero fino a 24 ore per veicoli spenti/inattivi
             // Non cerchiamo il massimo nelle 24 ore, per evitare oscillazioni successive.
             let from=new Date(fillMs-15*60*1000);
             let to=new Date(fillMs+24*60*60*1000);

             let rows=await statusWindow(
              deviceId,
              FUEL_VOLUME_DIAGNOSTIC_ID,
              from,
              to
             ).catch(()=>[]);

             let s=realSamples(rows).sort((a,b)=>new Date(a.date)-new Date(b.date));
             if(s.length<2)return null;

             let before=s.filter(x=>new Date(x.date).getTime()<=fillMs);
             let after=s.filter(x=>new Date(x.date).getTime()>fillMs);
             if(!before.length||!after.length)return null;

             let pre=before.reduce((min,x)=>Number(x.data)<Number(min.data)?x:min,before[0]);
             let peak=after.find(x=>Number(x.data)-Number(pre.data)>=3)||null;
             if(!peak)return null;

             let rise=Number(peak.data)-Number(pre.data);
             if(!Number.isFinite(rise)||rise<3)return null;

             return {
              before:Number(pre.data),
              after:Number(peak.data),
              rise,
              date:peak.date,
              diagnosticId:FUEL_VOLUME_DIAGNOSTIC_ID,
              method:"minimo 15 min prima → primo aumento >=3 L entro 24h"
             };
            }

                         // v57: riconciliazione FillUp Peugeot con l'aumento percentuale reale.
             // Nessuna data o coordinata di test viene codificata nella logica.
             async function reconcilePeugeotFillUp(f,deviceId){
              if(String(deviceId)!=="b1")return null;
              const original=new Date(f.dateTime||f.date||f.timestamp);
              if(isNaN(original))return null;
              const start=new Date(original.getTime()-30*60000);
              const end=new Date(original.getTime()+48*3600000);
              let raw=await statusWindow(deviceId,FUEL_PERCENT_DIAGNOSTIC_ID,start,end).catch(()=>[]);
              let samples=realSamples(raw).filter(r=>{
               let t=Date.parse(r.date);
               return Number.isFinite(t)&&t>=start.getTime()&&t<=end.getTime();
              }).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date));
              const expected=Number(f.derivedVolume);
              const capacity=Number(f.tankCapacity?.volume)||44;
              const candidates=[];
              for(let i=1;i<samples.length;i++){
               let a=samples[i-1],b=samples[i],delta=Number(b.data)-Number(a.data);
               if(delta<3||!Number.isFinite(delta))continue;
               let liters=delta*capacity/100;
               let t=Date.parse(b.date);
               if(t<original.getTime()-30*60000)continue;
               // Richiediamo una corrispondenza volumetrica per evitare di spostare
               // il FillUp su un rifornimento diverso nelle 48 ore successive.
               if(Number.isFinite(expected)&&expected>0&&Math.abs(liters-expected)>Math.max(2,expected*.20))continue;
               candidates.push({date:b.date,pre:a.data,post:b.data,delta,liters});
              }
              if(candidates.length!==1)return null; // ambiguita: conserviamo FillUp
              const rise=candidates[0],riseTime=Date.parse(rise.date);
              // Individua la sosta precedente al salto, non il GPS durante la marcia.
              const gpsFrom=new Date(riseTime-20*60000),gpsTo=new Date(riseTime+60000);
              let gpsRaw=await get("LogRecord",{
               deviceSearch:{id:deviceId},fromDate:gpsFrom.toISOString(),toDate:gpsTo.toISOString()
              },10000).catch(()=>[]);
              let gps=gpsRaw.map(r=>({date:r.dateTime,t:Date.parse(r.dateTime),lat:Number(r.latitude),lon:Number(r.longitude),speed:Number(r.speed)}))
               .filter(r=>Number.isFinite(r.t)&&r.t>=gpsFrom.getTime()&&r.t<=riseTime&&Number.isFinite(r.lat)&&Number.isFinite(r.lon))
               .sort((a,b)=>a.t-b.t);
              let stops=[],current=[];
              function finishStop(){
               if(current.length&&current[current.length-1].t-current[0].t>=60000){
                stops.push({start:current[0],end:current[current.length-1]});
               }
               current=[];
              }
              for(const r of gps){
               if(Number.isFinite(r.speed)&&r.speed<=1){
                if(current.length&&r.t-current[current.length-1].t>120000)finishStop();
                current.push(r);
               }else finishStop();
              }
              finishStop();
              const stop=stops.filter(x=>riseTime-x.end.t<=20*60000).sort((a,b)=>b.end.t-a.end.t)[0];
              if(!stop)return null;
              return {
               date:stop.start.date,coords:[stop.start.lat,stop.start.lon],
               riseDate:rise.date,percentBefore:rise.pre,percentAfter:rise.post,
               percentDelta:rise.delta,estimatedLiters:rise.liters,
               originalDate:f.dateTime||f.date||f.timestamp,
               stopStart:stop.start.date,stopEnd:stop.end.date
              };
             }

async function processFill(f,vehicleFuel,deviceId,vehicle){
             let originalCoords=fillCoords(f),originalDate=f.dateTime||f.date||f.timestamp;
             let fuel=normalizeFuel(f.productType)||vehicleFuel;
             let out={date:originalDate,originalDate,liters:0,fuel,coords:originalCoords,recovery:null};

             // v53 CALIBRAZIONE PEUGEOT: conserviamo i valori che Geotab restituisce direttamente
             // nell'oggetto FillUp, senza usarli ancora per modificare costi/statistiche.
             out.geotabFillUpVolume=Number.isFinite(Number(f.volume))?Number(f.volume):null;
             out.geotabDerivedVolume=Number.isFinite(Number(f.derivedVolume))?Number(f.derivedVolume):null;
             out.geotabTankCapacity=Number.isFinite(Number(f.tankCapacity?.volume))?Number(f.tankCapacity.volume):(Number.isFinite(Number(f.tankCapacity))?Number(f.tankCapacity):null);
             out.geotabTankCapacitySource=(f.tankCapacity&&typeof f.tankCapacity==="object"&&f.tankCapacity.source)?String(f.tankCapacity.source):null;
             // v56: capacità nominale nota, solo informativa; NON entra nel calcolo dei litri.
             // Oioli, Elisa - Citroën C3 diesel, VIN VF72CBHYBJ4081269: serbatoio nominale 42 L.
             const vehicleVin=vinOf(vehicle||{});
             if(vehicleVin==="VF72CBHYBJ4081269"){
              out.nominalTankCapacity=42;
              out.nominalTankCapacityVehicle="Citroën C3 diesel";
              out.nominalTankCapacitySource="specifica nominale veicolo";
             }
             out.geotabTotalFuelUsed=Number.isFinite(Number(f.totalFuelUsed))?Number(f.totalFuelUsed):null;
             out.geotabTankLevelExtrema=f.tankLevelExtrema??null;

             // UNICA FONTE DEI LITRI:
             // StatusData -> DiagnosticFuelUnitsId
             // "LIVELLO DEL CARBURANTE (VOLUME)" in litri.
             let [rise,percentRise]=await Promise.all([
              fuelRiseFromMeasuredStatus(f,deviceId),
              fuelPercentRiseFromMeasuredStatus(f,deviceId)
             ]);

             if(percentRise){
              out.fuelPercentBefore=Number(percentRise.before);
              out.fuelPercentAfter=Number(percentRise.after);
              out.fuelPercentDelta=Number(percentRise.rise);
              out.fuelPercentConfirmed=Number(percentRise.rise)>=2;
             }else{
              out.fuelPercentUnavailable=true;
             }

             if(rise&&Number(rise.rise)>0){
              out.rawFuelVolumeDelta=Number(rise.rise);
              out.liters=Math.max(0,(Number(rise.after)-Number(rise.before)));
              out.litersFromDelta=true;
              out.fuelVolumeBefore=Number(rise.before);
              out.fuelVolumeAfter=Number(rise.after);
              out.fuelVolumeRiseDate=rise.date||null;
              out.fuelVolumeMethod=rise.method||null;
              // v55: data e posizione restano SEMPRE quelle del FillUp originale.
              // Il campione StatusData può arrivare anche molte ore dopo e serve solo ai litri.
              out.date=originalDate;
              out.directFuelUnitsDelta=true;
             }else{
              out.liters=0;
              out.litersUnavailable=true;
             }

             // v53: calibrazione empirica SOLO per Martons - Peugeot 2008 (device b1).
             // Su 7 rifornimenti reali verificati, derivedVolume sovrastima in media
             // di 3,04 L. Usiamo quindi il derivedVolume nativo Geotab meno l'offset.
             // Gli altri veicoli usano la regola generale DiagnosticFuelUnitsId della v55.
             const PEUGEOT_2008_DEVICE_ID="b1";
             const PEUGEOT_2008_FUEL_OFFSET_L=3.04;
             if(String(deviceId)===PEUGEOT_2008_DEVICE_ID && Number.isFinite(out.geotabDerivedVolume) && out.geotabDerivedVolume>=5){
              out.litersBeforeCalibration=out.liters;
              out.liters=Math.max(0,out.geotabDerivedVolume-PEUGEOT_2008_FUEL_OFFSET_L);
              out.litersCalibrated=true;
              out.litersCalibrationOffset=PEUGEOT_2008_FUEL_OFFSET_L;
              out.litersCalibrationSource="derivedVolume Geotab - offset Peugeot";
              out.litersUnavailable=false;
             }

             // v57: per Peugeot b1 correggiamo data e GPS solo se un UNICO
              // aumento percentuale coincide col derivedVolume e con una sosta GPS.
              // Gli altri veicoli mantengono il comportamento preesistente.
              let matched=null;
              if(String(deviceId)==="b1"){
               matched=await reconcilePeugeotFillUp(f,deviceId);
               if(matched){
                out.date=matched.date;
                out.coords=matched.coords;
                out.dateCorrectedFromFuelPercent=true;
                out.fuelPercentBefore=matched.percentBefore;
                out.fuelPercentAfter=matched.percentAfter;
                out.fuelPercentDelta=matched.percentDelta;
                out.fuelPercentConfirmed=true;
                out.fuelPercentRiseDate=matched.riseDate;
                out.fuelPercentEstimatedLiters=matched.estimatedLiters;
                out.refuelStopStart=matched.stopStart;
                out.refuelStopEnd=matched.stopEnd;
               }
              }
              let ns=null;
              if(out.coords)ns=await nearestStation(out.coords[0],out.coords[1]);

             let recovery=null;
             if(!ns){
              recovery=await recoveryFromNextIgnition(f,deviceId);
              out.recovery=recovery;
              if(recovery.used&&recovery.station&&recovery.gps){
               ns=recovery.station;
               out.stationRecovered=true;
               out.coords=[recovery.gps.lat,recovery.gps.lon];
              }
             }

             if(!ns){
              out.error=recovery&&recovery.message?recovery.message:"Impianto MIMIT non identificato";
              return out;
             }

             out.station=ns;
             out.supplier=supplier(ns);
             if(!fuel){out.error="Carburante non riconosciuto";return out}

             let hp=await historicalPrice(ns.raw[0],fuel,out.date);
             if(!hp){out.error="Prezzo storico non trovato";return out}

             out.price=hp;
             out.priceMode=hp.selfPrice?"1":(hp.servedPrice?"0":"1");
             let chosen=out.priceMode==="0"?(hp.servedPrice||hp):(hp.selfPrice||hp.servedPrice||hp);
             out.verified=!!chosen;
             out.cost=chosen?out.liters*Number(chosen.price):0;
             out.source=chosen?(chosen.source||"MIMIT"):"";
             return out;
            }

            function selectedPriceForItem(x){
             if(!x||!x.price)return null;
             let mode=x.priceMode||"1";
             if(mode==="0"&&x.price.servedPrice)return x.price.servedPrice;
             if(mode==="1"&&x.price.selfPrice)return x.price.selfPrice;
             return x.price.selfPrice||x.price.servedPrice||x.price;
            }

            function recalcItemCost(x){
             let p=selectedPriceForItem(x);
             if(p&&Number.isFinite(Number(p.price))){
              x.verified=true;
              x.cost=(x.liters||0)*Number(p.price);
              x.source=p.source||"MIMIT";
             }else{
              x.verified=false;x.cost=0;
             }
            }

                         // Recupero alternativo SOLO per Peugeot b1: il salto FuelUnits non e un FillUp ufficiale.
             // Soglie prudenti: aumento 5..35 L, campioni distanti <=90 min, GPS entro 120 m,
             // nessun FillUp originale entro 45 min. La calibrazione -2,70 L e sperimentale.
             const RECOVERY_DEVICE_ID="b1";
             const RECOVERY_OFFSET_L=2.70;
             const RECOVERY_MIN_RISE_L=5;
             const RECOVERY_MAX_RISE_L=35;
             const RECOVERY_GPS_RADIUS_M=120;
             const RECOVERY_MATCH_FILL_MS=45*60000;

             async function readFuelUnitsForRecovery(deviceId,from,to){
              let all=[],cursor=from.getTime(),end=to.getTime(),truncated=false;
              // Intervalli di 3 giorni con sovrapposizione per non perdere un salto a cavallo.
              while(cursor<end){
               let stop=Math.min(cursor+3*86400000,end);
               let a=new Date(Math.max(from.getTime(),cursor-30*60000));
               let b=new Date(Math.min(end,stop+30*60000));
               let chunk=await get("StatusData",{
                deviceSearch:{id:deviceId},diagnosticSearch:{id:FUEL_VOLUME_DIAGNOSTIC_ID},
                fromDate:a.toISOString(),toDate:b.toISOString()
               },50000);
               if(chunk.length>=50000)truncated=true;
               // Ignoriamo campioni sintetici ai limiti: richiediamo ID reale e timestamp interno.
               for(const r of chunk){
                let t=Date.parse(r.dateTime),value=Number(r.data);
                if(!r.id||!Number.isFinite(t)||!Number.isFinite(value)||t<from.getTime()||t>to.getTime())continue;
                all.push({id:String(r.id),t,value,date:r.dateTime});
               }
               cursor=stop;
              }
              let seen=new Set();
              all=all.sort((a,b)=>a.t-b.t).filter(r=>{let k=r.id+":"+r.t;if(seen.has(k))return false;seen.add(k);return true;});
              return {rows:all,truncated};
             }

             async function findRecoveredFuelUnits(deviceId,from,to,fills,vehicleFuel){
              if(String(deviceId)!==RECOVERY_DEVICE_ID)return {items:[],jumps:0,matched:0,truncated:false};
              let fetched=await readFuelUnitsForRecovery(deviceId,from,to),s=fetched.rows;
              let possible=[];
              for(let i=1;i<s.length;i++){
               let pre=s[i-1],post=s[i],delta=post.value-pre.value,elapsed=post.t-pre.t;
               if(elapsed<=0||elapsed>90*60000||delta<RECOVERY_MIN_RISE_L||delta>RECOVERY_MAX_RISE_L)continue;
               if(fills.some(f=>{let t=Date.parse(f.dateTime||f.date||f.timestamp);return Number.isFinite(t)&&Math.abs(t-post.t)<=RECOVERY_MATCH_FILL_MS;}))continue;
               // Un singolo salto e una proposta; non deve generare doppioni ravvicinati.
               if(possible.some(x=>Math.abs(x.post.t-post.t)<90*60000))continue;
               possible.push({pre,post,delta});
              }
              let items=[],matched=0;
              for(const jump of possible){
               // La posizione e indispensabile: non attribuiamo aumenti del livello a un impianto lontano.
               let gps=await firstGpsAfter(deviceId,jump.post.date,12);
               if(!gps||gps.error||!Number.isFinite(gps.lat)||!Number.isFinite(gps.lon))continue;
               let distance=hav(gps.lat,gps.lon,44.85254,11.58680);
               // La v55 non possiede ancora una ricerca delle soste per TUTTI gli impianti:
               // il recupero e limitato al distributore di riferimento validato nei test.
               if(distance>RECOVERY_GPS_RADIUS_M)continue;
               matched++;
               let liters=Math.max(0,jump.delta-RECOVERY_OFFSET_L);
               let item={
                date:jump.post.date,originalDate:jump.post.date,liters,fuel:vehicleFuel,
                coords:[gps.lat,gps.lon],estimatedFromFuelUnits:true,
                fuelUnitsBefore:jump.pre.value,fuelUnitsAfter:jump.post.value,
                fuelUnitsRawDelta:jump.delta,fuelUnitsOffset:RECOVERY_OFFSET_L,
                fuelUnitsGpsDistance:distance,geotabFillUpVolume:null,
                geotabDerivedVolume:null,geotabTankCapacity:null,
                geotabTotalFuelUsed:null,verified:false,cost:0,
                error:"Stima FuelUnits: impianto/prezzo non trovato"
               };
               try{
                let ns=await nearestStation(gps.lat,gps.lon);
                if(ns){
                 item.station=ns;item.supplier=supplier(ns);delete item.error;
                 if(vehicleFuel){
                  let hp=await historicalPrice(ns.raw[0],vehicleFuel,item.date);
                  if(hp){
                   item.price=hp;
                   item.priceMode=hp.selfPrice?"1":(hp.servedPrice?"0":"1");
                   recalcItemCost(item);
                  }else item.error="Prezzo storico non trovato";
                 }else item.error="Carburante non riconosciuto";
                }
               }catch(e){item.error="Ricerca MIMIT non disponibile: "+e.message;}
               items.push(item);
              }
              return {items,jumps:possible.length,matched,truncated:fetched.truncated};
             }

function render(items){
             let tb=$("rows");tb.innerHTML="";
             for(const x of items)recalcItemCost(x);

             for(let index=0;index<items.length;index++){
              let x=items[index];
              let sup=x.supplier?`<div class="cc-supplier">${esc(x.supplier.gestore||x.supplier.nome||"Impianto MIMIT")}</div><div class="cc-sub">${esc([x.supplier.bandiera,x.supplier.nome].filter(Boolean).join(" — "))}</div><div class="cc-sub">${esc(x.supplier.address)}${x.station?` · ${dec(x.station.distance,1)} m`:""}</div>`:`<span class="cc-warn">${esc(x.error||"Non identificato")}</span>`;

              let sp=x.price&&x.price.selfPrice, vp=x.price&&x.price.servedPrice;
              let different=sp&&vp&&Math.abs(Number(sp.price)-Number(vp.price))>0.0005;
              let fuelCell=esc(x.fuel||"—");

              if(different){
               fuelCell+=`<div class="cc-sub" style="margin-top:6px"><select class="cc-fuel-mode" data-index="${index}" style="max-width:130px;height:30px">
                <option value="1"${(x.priceMode||"1")==="1"?" selected":""}>Self service</option>
                <option value="0"${x.priceMode==="0"?" selected":""}>Servito</option>
               </select></div>`;
              }else if(sp&&vp){
               fuelCell+=`<div class="cc-sub">Self / Servito</div>`;
              }else if(sp){
               fuelCell+=`<div class="cc-sub">Self service</div>`;
              }else if(vp){
               fuelCell+=`<div class="cc-sub">Servito</div>`;
              }

              let chosen=selectedPriceForItem(x);
              let price=chosen?`${dec(chosen.price,3)}<div class="cc-sub">${esc(dtLocal(chosen.date))}</div>`:`<span class="cc-warn">—</span>`;
              let cost=x.verified?money(x.cost):"—",tr=document.createElement("tr");
              let percentInfo=Number.isFinite(x.fuelPercentDelta)?`<div class="cc-sub">${dec(x.fuelPercentBefore,1)}% → ${dec(x.fuelPercentAfter,1)}% (Δ +${dec(x.fuelPercentDelta,1)}%)${x.fuelPercentConfirmed?" · confermato":""}</div>`:"";
              let diagParts=[];
               if(x.estimatedFromFuelUnits){
                diagParts.push(`<b>Rifornimento stimato da DiagnosticFuelUnitsId — NON FillUp Geotab</b>`);
                diagParts.push(`Volume: ${dec(x.fuelUnitsBefore,2)} → ${dec(x.fuelUnitsAfter,2)} L`);
                diagParts.push(`Aumento grezzo: ${dec(x.fuelUnitsRawDelta,2)} L · Correzione sperimentale: −${dec(x.fuelUnitsOffset,2)} L`);
                diagParts.push(`GPS a ${dec(x.fuelUnitsGpsDistance,1)} m dal distributore di riferimento`);
               }
              if(Number.isFinite(x.geotabFillUpVolume))diagParts.push(`FillUp.volume: <b>${dec(x.geotabFillUpVolume,2)} L</b>`);
              if(Number.isFinite(x.geotabDerivedVolume))diagParts.push(`derivedVolume: <b>${dec(x.geotabDerivedVolume,2)} L</b>`);
              if(Number.isFinite(x.geotabTankCapacity)){
               let capLabel=x.geotabTankCapacitySource==="EstimateFuelUnits"?"Capacità stimata Geotab":"Capacità serbatoio Geotab";
               diagParts.push(`${capLabel}: ${dec(x.geotabTankCapacity,2)} L${x.geotabTankCapacitySource?` · Fonte: ${esc(x.geotabTankCapacitySource)}`:""}`);
              }
              if(Number.isFinite(x.nominalTankCapacity)){
               diagParts.push(`Capacità nominale veicolo: <b>${dec(x.nominalTankCapacity,0)} L</b>${x.nominalTankCapacityVehicle?` · ${esc(x.nominalTankCapacityVehicle)}`:""}`);
               diagParts.push(`<span class="cc-muted">La capacità nominale è solo informativa e non viene usata nel calcolo dei litri riforniti.</span>`);
              }
              if(Number.isFinite(x.geotabTotalFuelUsed))diagParts.push(`totalFuelUsed: ${dec(x.geotabTotalFuelUsed,2)} L`);
              if(Number.isFinite(x.rawFuelVolumeDelta))diagParts.push(`DiagnosticFuelUnitsId Δ: <b>${dec(x.rawFuelVolumeDelta,2)} L</b>`);
              if(x.litersCalibrated){
               diagParts.push(`Calibrazione Peugeot: <b>−${dec(x.litersCalibrationOffset,2)} L</b>`);
               diagParts.push(`Litri utilizzati: <b>${dec(x.liters,2)} L</b>`);
               diagParts.push(`Metodo: ${esc(x.litersCalibrationSource||"calibrazione Peugeot")}`);
              }
              if(x.directFuelUnitsDelta){
               if(Number.isFinite(x.fuelVolumeBefore)&&Number.isFinite(x.fuelVolumeAfter))diagParts.push(`Livello carburante: <b>${dec(x.fuelVolumeBefore,2)} → ${dec(x.fuelVolumeAfter,2)} L</b>`);
               if(!x.litersCalibrated)diagParts.push(`Litri utilizzati: <b>${dec(x.liters,2)} L</b>`);
               if(x.fuelVolumeRiseDate)diagParts.push(`Aumento rilevato: ${esc(dtLocal(x.fuelVolumeRiseDate))}`);
               diagParts.push(`Metodo FuelUnits: ${esc(x.fuelVolumeMethod||"delta DiagnosticFuelUnitsId")}`);
              }
              let extremaText="";
              if(x.geotabTankLevelExtrema!=null){try{extremaText=JSON.stringify(x.geotabTankLevelExtrema)}catch(e){extremaText=String(x.geotabTankLevelExtrema)}}
              let diagInfo=`<details class="cc-sub" style="margin-top:6px;text-align:left"><summary>Diagnostica Geotab</summary><div style="margin-top:4px">${diagParts.join("<br>")||"Nessun valore FillUp aggiuntivo disponibile"}${extremaText?`<br>tankLevelExtrema: <span style="word-break:break-all">${esc(extremaText)}</span>`:""}</div></details>`;
              tr.innerHTML=`<td>${esc(dtLocal(x.date))}${x.estimatedFromFuelUnits?'<div class="cc-sub" style="color:#9a6700;font-weight:bold">STIMATO · FuelUnits</div>':''}</td><td>${sup}</td><td>${fuelCell}</td><td class="cc-num">${price}</td><td>${esc(x.source||"—")}</td><td class="cc-num">${dec(x.liters||0,2)} L${percentInfo}${diagInfo}</td><td class="cc-num"><b>${cost}</b></td>`;
              tb.appendChild(tr);
             }

             if(!items.length)tb.innerHTML='<tr><td colspan="7" class="cc-muted">Nessun rifornimento nel periodo selezionato.</td></tr>';

             let tl=0,tc=0,vl=0;
             for(const x of items){tl+=x.liters||0;if(x.verified){tc+=x.cost;vl+=x.liters||0}}
             $("n").textContent=items.length;$("liters").textContent=dec(tl,2)+" L";$("total").textContent=money(tc);$("avg").textContent=vl>0?dec(tc/vl,3)+" €/L":"—";

             tb.querySelectorAll(".cc-fuel-mode").forEach(sel=>sel.addEventListener("change",e=>{
              let x=items[Number(e.target.dataset.index)];
              if(!x)return;
              x.priceMode=e.target.value;
              recalcItemCost(x);
              render(items);
             }));
            }

            function vinOf(v){return String(v.vehicleIdentificationNumber||v.vin||v.serialNumber||"").trim().toUpperCase()}

            function cleanVehicleField(v){return String(v==null?"":v).replace(/\s+/g," ").trim()}

            function firstVehicleField(v,names){
             if(!v)return "";
             for(const n of names){let x=cleanVehicleField(v[n]);if(x)return x}
             return "";
            }

            function geotabVehicleInfo(v){
             if(!v)return null;
             let make=firstVehicleField(v,["make","manufacturer","vehicleMake","assetMake","makeName","manufacturerName"]);
             let model=firstVehicleField(v,["model","vehicleModel","assetModel","modelName"]);
             let year=firstVehicleField(v,["year","modelYear","vehicleYear","assetYear"]);
             let nested=[v.vehicleData,v.minedVehicleData,v.vehicleIdentification,v.vehicleInformation,v.assetInformation,v.identification,v.details,v.metadata].filter(Boolean);
             for(const x of nested){
              if(!make)make=firstVehicleField(x,["make","manufacturer","vehicleMake","makeName","manufacturerName"]);
              if(!model)model=firstVehicleField(x,["model","vehicleModel","modelName"]);
              if(!year)year=firstVehicleField(x,["year","modelYear","vehicleYear"]);
             }
             if(make&&model)return {make,model,year,source:"Geotab",query:[make,model,year,"car"].filter(Boolean).join(" ")};
             return null;
            }

            function knownVehicleFromVin(v){
             let vin=vinOf(v);
             if(!vin)return null;
             if(vin.startsWith("VR3USHNKK"))return {make:"Peugeot",model:"2008",year:"",source:"VIN locale",query:"Peugeot 2008 car"};
             if(vin.startsWith("UU15SDAG35"))return {make:"Dacia",model:"Sandero",year:"",source:"VIN locale",query:"Dacia Sandero car"};
             if(vin==="WAUZZZGA6RA002632")return {make:"Audi",model:"Q2",year:"2024",source:"VIN locale",query:"Audi Q2 2024 car"};
             return null;
            }

            function vehicleFromName(v){
             let name=cleanVehicleField(v&&v.name);
             if(!name)return null;
             const makes=["Abarth","Alfa Romeo","Audi","BMW","Citroen","Citroën","Cupra","Dacia","Fiat","Ford","Honda","Hyundai","Iveco","Jeep","Kia","Land Rover","Lancia","MAN","Mazda","Mercedes-Benz","Mercedes","Mini","Nissan","Opel","Peugeot","Renault","Seat","Skoda","Škoda","Suzuki","Tesla","Toyota","Volkswagen","Volvo"];
             let foundMake="",matchIndex=-1,matchLength=0;
             for(const make of makes){
              let pattern=make.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
              if(make==="Citroën")pattern="Citro[eë]n";
              if(make==="Škoda")pattern="[ŠS]koda";
              let re=new RegExp("\\b"+pattern+"\\b","i"),m=name.match(re);
              if(m){foundMake=make;matchIndex=m.index;matchLength=m[0].length;break}
             }
             if(!foundMake||matchIndex<0)return null;
             let after=name.slice(matchIndex+matchLength).trim().replace(/^[-–—_:]+/,"").trim();
             if(!after)return null;
             let pieces=after.split(/\s+/),modelParts=[];
             for(const p of pieces){
              if(/^[A-HJ-NPR-Z0-9]{17}$/i.test(p))break;
              if(/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/i.test(p))break;
              modelParts.push(p);
              if(modelParts.length>=3)break;
             }
             let model=modelParts.join(" ").trim();
             if(!model)return null;
             if(/^Mercedes$/i.test(foundMake))foundMake="Mercedes-Benz";
             if(/^Citroën$/i.test(foundMake))foundMake="Citroen";
             if(/^Škoda$/i.test(foundMake))foundMake="Skoda";
             return {make:foundMake,model,year:"",source:"Nome Geotab",query:`${foundMake} ${model} car`};
            }

            async function decodeVin(v){
             let vin=vinOf(v);
             if(!vin)return null;
             let known=knownVehicleFromVin(v);
             if(known)return known;
             try{
              let url="https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/"+encodeURIComponent(vin)+"?format=json";
              let response=await fetch(url,{cache:"no-store"});
              if(response.ok){
               let json=await response.json(),x=(json.Results||[])[0]||{};
               let make=cleanVehicleField(x.Make),model=cleanVehicleField(x.Model),year=cleanVehicleField(x.ModelYear);
               if(make&&model)return {make,model,year,fuelTypePrimary:cleanVehicleField(x.FuelTypePrimary),fuelTypeSecondary:cleanVehicleField(x.FuelTypeSecondary),electrificationLevel:cleanVehicleField(x.ElectrificationLevel),source:"VIN",query:[make,model,year,"car"].filter(Boolean).join(" ")};
              }
             }catch(e){console.warn("Decoder VIN non disponibile:",e)}
             return null;
            }

            function normalizePhotoWords(v){
             return cleanVehicleField(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
            }

            function photoScore(title,info){
             let t=normalizePhotoWords(title),make=normalizePhotoWords(info.make),model=normalizePhotoWords(info.model),year=normalizePhotoWords(info.year),score=0;
             if(make&&t.includes(make))score+=5;
             if(model&&t.includes(model))score+=10;
             if(year&&t.includes(year))score+=2;
             const badWords=["logo","badge","emblem","interior","dashboard","engine","motor","wheel","rim","brochure","diagram","drawing","sketch","toy","miniature"];
             for(const word of badWords)if(t.includes(word))score-=5;
             return score;
            }

            async function searchCommons(query,info){
             try{
              let p=new URLSearchParams({action:"query",generator:"search",gsrsearch:`${query} filetype:bitmap`,gsrnamespace:"6",gsrlimit:"20",prop:"imageinfo",iiprop:"url",iiurlwidth:"600",format:"json",origin:"*"});
              let response=await fetch("https://commons.wikimedia.org/w/api.php?"+p.toString(),{cache:"force-cache"});
              if(!response.ok)return null;
              let json=await response.json(),pages=Object.values((json.query||{}).pages||{}),candidates=[];
              for(const page of pages){
               let imageInfo=(page.imageinfo||[])[0];
               if(!imageInfo)continue;
               let url=imageInfo.thumburl||imageInfo.url;
               if(!url)continue;
               candidates.push({url,title:page.title||"",score:photoScore(page.title||"",info)});
              }
              candidates.sort((a,b)=>b.score-a.score);
              if(!candidates.length||candidates[0].score<10)return null;
              return candidates[0].url;
             }catch(e){console.warn("Ricerca Wikimedia fallita:",e);return null}
            }

            async function commonsPhoto(info){
             if(!info||!info.make||!info.model)return null;
             let q1=[info.make,info.model,info.year,"car"].filter(Boolean).join(" ");
             let photo=await searchCommons(q1,info);
             if(photo)return photo;
             let q2=[info.make,info.model,"automobile"].filter(Boolean).join(" ");
             photo=await searchCommons(q2,info);
             return photo||null;
            }

            function setPhoto(url){
             vehiclePhotoUrl=url||"";
             $("vehiclePhoto").innerHTML=url?`<img src="${esc(url)}" alt="Foto generica del veicolo">`:'<div class="cc-photo-placeholder">🚗</div>';
             let img=$("vehiclePhoto").querySelector("img");
             if(img)img.addEventListener("error",()=>setPhoto(""),{once:true});
            }

            async function updateVehiclePhoto(){
             let v=vehicles.find(x=>x.id===$("vehicle").value);
             lastVehicle=v||null;setPhoto("");
             if(!v)return;
             let info=geotabVehicleInfo(v);
             if(!info)info=await decodeVin(v);
             if(!info)info=vehicleFromName(v);
             if(!info){
              console.warn("Veicolo non identificato:",{name:v.name,vin:vinOf(v)});
              return;
             }
             console.log("Veicolo identificato:",{name:v.name,vin:vinOf(v),make:info.make,model:info.model,year:info.year,source:info.source});
             let url=await commonsPhoto(info);
             if(!url)console.warn("Foto non trovata:",info);
             setPhoto(url);
            }

            function exportEnabled(on){for(const id of ["pdf","excel","print"])$(id).disabled=!on}
            function reportRows(){
             return lastItems.map(x=>({
              data:dtLocal(x.date),
              distributore:x.supplier?(x.supplier.gestore||x.supplier.nome||"Impianto MIMIT"):(x.error||"Non identificato"),
              carburante:x.fuel||"",
              prezzo:x.verified?Number(x.price.price).toFixed(3):"",
              fonte:x.source||"",
              litri:Number(x.liters||0).toFixed(2),
              costo:x.verified?Number(x.cost).toFixed(2):""
             }));
            }
            function downloadBlob(blob,name){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
            function exportExcel(){
             let rows=reportRows(),v=lastVehicle||{},vin=vinOf(v),from=$("dateFrom").value,to=$("dateTo").value;
             let xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Costi Carburante"><Table>';
             let row=a=>'<Row>'+a.map(c=>'<Cell><Data ss:Type="String">'+esc(c)+'</Data></Cell>').join("")+'</Row>';
             xml+=row(["Costi Carburante"])+row(["Veicolo",v.name||""])+row(["VIN",vin])+row(["Periodo",from+" - "+to])+row([]);
             xml+=row(["Data rifornimento","Distributore rilevato","Carburante","Prezzo €/L","Fonte","Litri","Costo totale €"]);
             for(const r of rows)xml+=row([r.data,r.distributore,r.carburante,r.prezzo,r.fonte,r.litri,r.costo]);
             xml+="</Table></Worksheet></Workbook>";
             downloadBlob(new Blob([xml],{type:"application/vnd.ms-excel;charset=utf-8"}),`costi-carburante-${from}-${to}.xls`);
            }
            function pdfEscape(s){return String(s??"").replace(/[^\x20-\x7E\xA0-\xFF]/g," ").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
            function exportPdf(){
             let rows=reportRows(),v=lastVehicle||{},from=$("dateFrom").value,to=$("dateTo").value;
             let lines=[`COSTI CARBURANTE`,`Veicolo: ${v.name||""}`,`Periodo: ${from} - ${to}`,""];
             lines.push("Data | Distributore | Carburante | Prezzo | Fonte | Litri | Costo");
             for(const r of rows)lines.push(`${r.data} | ${r.distributore} | ${r.carburante} | ${r.prezzo} | ${r.fonte} | ${r.litri} | ${r.costo}`);
             let pages=[];for(let i=0;i<lines.length;i+=42)pages.push(lines.slice(i,i+42));
             let objs=[],pageIds=[],fontId=3, next=4;
             for(let p=0;p<pages.length;p++){pageIds.push(next);next+=2}
             objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
             objs[2]=`<< /Type /Pages /Kids [${pageIds.map(x=>x+" 0 R").join(" ")}] /Count ${pages.length} >>`;
             objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>";
             for(let p=0;p<pages.length;p++){
              let pid=pageIds[p],cid=pid+1,y=800,content="BT /F1 9 Tf ";
              for(const line of pages[p]){content+=`1 0 0 1 35 ${y} Tm (${pdfEscape(line).slice(0,155)}) Tj `;y-=18}
              content+="ET";
              objs[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${cid} 0 R >>`;
              objs[cid]=`<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
             }
             let pdf="%PDF-1.4\n",offsets=[0];
             for(let i=1;i<objs.length;i++){if(!objs[i])continue;offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
             let xref=pdf.length,max=objs.length-1;pdf+=`xref\n0 ${max+1}\n0000000000 65535 f \n`;
             for(let i=1;i<=max;i++)pdf+=(String(offsets[i]||0).padStart(10,"0")+" 00000 n \n");
             pdf+=`trailer\n<< /Size ${max+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
             downloadBlob(new Blob([new Uint8Array([...pdf].map(c=>c.charCodeAt(0)&255))],{type:"application/pdf"}),`costi-carburante-${from}-${to}.pdf`);
            }
            function printReport(){window.print()}

            async function loadHistory(){
             $("status").className="cc-status";
             $("status").textContent="Avvio caricamento storico…";
             await new Promise(r=>setTimeout(r,0));
             let vid=$("vehicle").value,fromValue=$("dateFrom").value,toValue=$("dateTo").value;
             if(!vid){$("status").className="cc-status err";$("status").textContent="Seleziona un veicolo.";return}
             if(!fromValue||!toValue){$("status").className="cc-status err";$("status").textContent="Seleziona la data iniziale e la data finale.";return}
             if(fromValue>toValue){$("status").className="cc-status err";$("status").textContent="La data iniziale non può essere successiva alla data finale.";return}
             let from=new Date(`${fromValue}T00:00:00`),to=new Date(`${toValue}T23:59:59.999`);
             exportEnabled(false);lastItems=[];$("load").disabled=true;$("status").className="cc-status";$("status").textContent="Caricamento rifornimenti…";
             try{
              let fillSearchFrom=String(vid)==="b1"?new Date(from.getTime()-48*3600000):from;
              let fills=await get("FillUp",{deviceSearch:{id:vid},fromDate:fillSearchFrom.toISOString(),toDate:to.toISOString()},50000);
              fills=(fills||[]).filter(f=>{let t=Date.parse(f.dateTime||f.date||f.timestamp);return Number.isFinite(t)&&t>=fillSearchFrom.getTime()&&t<=to.getTime();});
              fills=(fills||[]).sort((a,b)=>new Date(b.dateTime||b.date)-new Date(a.dateTime||a.date));
              let v=vehicles.find(x=>x.id===vid)||{},vf=await fuelForVehicle(v),out=[];
              for(let i=0;i<fills.length;i++){
               $("status").textContent=`Analisi rifornimento ${i+1} di ${fills.length}: posizione FillUp / recupero rapido da aumento carburante…`;
               let item;
               try{item=await processFill(fills[i],vf,vid,v)}
               catch(e){item={date:fills[i].dateTime||fills[i].date,liters:litersOf(fills[i]),fuel:vf,error:e.message}}
               if(Date.parse(item.date)>=from.getTime()&&Date.parse(item.date)<=to.getTime())out.push(item);
              }
              let recovery={items:[],jumps:0,matched:0,truncated:false},recoveryError="";
              if(String(vid)===RECOVERY_DEVICE_ID){
               $("status").textContent="Ricerca aumenti DiagnosticFuelUnitsId senza FillUp…";
               try{recovery=await findRecoveredFuelUnits(vid,from,to,fills,vf)}
               catch(e){recoveryError=e.message||String(e);console.error("Recupero FuelUnits",e)}
              }
              // v58: evita duplicati anche quando la data FillUp originale e stata
              // riconciliata con la data reale (es. rifornimento del 25 ottobre).
              // Un evento FuelUnits entro 90 minuti da un FillUp gia presente
              // non deve produrre una seconda riga.
              const uniqueRecovered=recovery.items.filter(candidate=>{
               const t=Date.parse(candidate.date);
               return Number.isFinite(t)&&!out.some(existing=>{
                const dates=[existing.date,existing.originalDate,existing.fuelPercentRiseDate,existing.fuelVolumeRiseDate];
                return dates.some(d=>d&&Number.isFinite(Date.parse(d))&&Math.abs(Date.parse(d)-t)<=90*60000);
               });
              });
              recovery.items=uniqueRecovered;
              out=out.concat(uniqueRecovered).sort((a,b)=>new Date(b.date)-new Date(a.date));
              lastItems=out;lastVehicle=v;render(out);exportEnabled(out.length>0);
              $("status").className="cc-status "+(recoveryError?"err":"ok");
              $("status").textContent=`Completato: ${out.length} rifornimenti nel periodo (${fills.length} FillUp esaminati) + ${recovery.items.length} stimati FuelUnits dal ${from.toLocaleDateString("it-IT")} al ${to.toLocaleDateString("it-IT")}.`+
               (String(vid)===RECOVERY_DEVICE_ID?` Salti senza FillUp: ${recovery.jumps}; associati a GPS: ${recovery.matched}.`:"")+
               (recovery.truncated?" ATTENZIONE: limite risultati FuelUnits raggiunto.":"")+
               (recoveryError?" Errore recupero FuelUnits: "+recoveryError:"");
             }catch(e){$("status").className="cc-status err";$("status").textContent="Errore: "+e.message}
             finally{$("load").disabled=false}
            }
            async function init(myApi){
             api=myApi;setDefaultDates();$("status").textContent="MyGeotab collegato. Caricamento veicoli…";
             try{
              await loadCoverage();
              vehicles=await get("Device",{},50000);vehicles=(vehicles||[]).filter(v=>!v.isArchived).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
              $("vehicle").innerHTML='<option value="">Seleziona un veicolo…</option>'+vehicles.map(v=>`<option value="${esc(v.id)}">${esc(v.name||v.id)}</option>`).join("");
              $("load").disabled=false;$("status").className="cc-status ok";$("status").textContent=`MyGeotab collegato. ${vehicles.length} veicoli disponibili.`;
             }catch(e){$("status").className="cc-status err";$("status").textContent="Errore MyGeotab: "+e.message}
            }
            let uiBound=false, dataLoaded=false, loading=false;
            function bindUi(){
             if(uiBound)return;
             const required=["load","vehicle","pdf","excel","print","dateFrom","dateTo","status","rows","n","liters","total","avg","vehiclePhoto"];
             for(const id of required)if(!$(id))throw new Error("Elemento HTML mancante: #"+id);
             $("load").addEventListener("click",loadHistory);
             $("vehicle").addEventListener("change",()=>{exportEnabled(false);lastItems=[];updateVehiclePhoto()});
             $("pdf").addEventListener("click",exportPdf);
             $("excel").addEventListener("click",exportExcel);
             $("print").addEventListener("click",printReport);
             $("dateFrom").addEventListener("change",()=>{$("dateTo").min=$("dateFrom").value||""});
             setDefaultDates();
             uiBound=true;
            }

            async function loadMyGeotabData(myApi){
             if(dataLoaded||loading)return;
             loading=true;api=myApi;
             $("status").className="cc-status";
             $("status").textContent="MyGeotab collegato. Caricamento veicoli…";
             try{
              await loadCoverage();
              vehicles=await get("Device",{},50000);
              vehicles=(vehicles||[]).filter(v=>!v.isArchived).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
              $("vehicle").innerHTML='<option value="">Seleziona un veicolo…</option>'+vehicles.map(v=>`<option value="${esc(v.id)}">${esc(v.name||v.id)}</option>`).join("");
              $("load").disabled=false;
              $("status").className="cc-status ok";
              $("status").textContent=`MyGeotab collegato. ${vehicles.length} veicoli disponibili.`;
              dataLoaded=true;
             }catch(e){
              console.error("Caricamento veicoli MyGeotab:",e);
              $("status").className="cc-status err";
              $("status").textContent="Errore MyGeotab: "+(e&&e.message?e.message:String(e));
             }finally{
              loading=false;
             }
            }

            window.geotab=window.geotab||{};
            window.geotab.addin=window.geotab.addin||{};
            window.geotab.addin.costiCarburante=function(){
             return {
              initialize:function(myApi,state,callback){
               api=myApi;
               try{bindUi()}
               catch(e){
                console.error("Inizializzazione UI Costi Carburante:",e);
                if($("status")){$("status").className="cc-status err";$("status").textContent="Errore avvio Add-In: "+(e&&e.message?e.message:String(e))}
               }
               // IMPORTANTE: MyGeotab deve ricevere subito il callback.
               // Il caricamento dei veicoli avviene in focus(), quando la UI è pronta.
               if(callback)callback();
              },
              focus:function(myApi,state){
               api=myApi||api;
               try{bindUi()}catch(e){console.error(e);return}
               if(api)loadMyGeotabData(api);
              },
              blur:function(api,state){}
             };
            };
            })();

</script></body></html>

<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 48907</title>
<style>body{font-family:Arial;background:#f4f6f8;color:#263238;margin:0}main{max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px}h1{color:#123f73}.ok{color:#08783e;font-weight:bold}.err{color:#b42318;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}code,pre{background:#f1f3f5;padding:4px;border-radius:4px}pre{white-space:pre-wrap}button{padding:10px 16px;background:#123f73;color:#fff;border:0;border-radius:7px;font-weight:bold}</style></head>
<body><main><div class="card"><h1>Test storico MIMIT — impianto 48907</h1><button id="run">Esegui test</button><p id="status">In attesa.</p></div>
<div class="card"><table><tr><th>Impianto</th><td>48907</td></tr><tr><th>Data rifornimento</th><td>15/09/2026 18:14:46</td></tr><tr><th>Carburante</th><td>Benzina</td></tr><tr><th>Litri</th><td>18,79</td></tr><tr><th>Prezzo</th><td id="price">—</td></tr><tr><th>Data prezzo</th><td id="date">—</td></tr><tr><th>Self</th><td id="self">—</td></tr><tr><th>Costo</th><td id="cost">—</td></tr></table></div>
<div class="card"><h2>Carburanti nel file</h2><div id="fuels">—</div></div><div class="card"><h2>Diagnostica</h2><pre id="diag">—</pre></div></main>
<script>
const ID=48907,LITERS=18.79,TARGET="2026-09-15T18:14:46";
async function loadGzip(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);if(!("DecompressionStream" in window))throw new Error("Browser senza DecompressionStream");const s=r.body.pipeThrough(new DecompressionStream("gzip"));return JSON.parse(await new Response(s).text())}
function findPrice(data){let a=[];for(const [key,h] of Object.entries(data.prezzi||{})){let p=key.lastIndexOf("|"),fuel=p>=0?key.slice(0,p):key,self=p>=0?key.slice(p+1):"";if(fuel.trim().toLowerCase()!=="benzina")continue;for(const row of h){if(row[0]<=TARGET)a.push({date:row[0],price:Number(row[1]),self,fuel})}}a.sort((x,y)=>y.date.localeCompare(x.date));return a.find(x=>x.self==="1")||a[0]||null}
async function run(){let st=document.getElementById("status"),diag=document.getElementById("diag");try{st.className="";st.textContent="Download in corso…";let bucket=String(Math.floor(ID/1000)).padStart(3,"0"),url=`data/prezzi/${bucket}/${ID}.json.gz`,data=await loadGzip(url),keys=Object.keys(data.prezzi||{}),x=findPrice(data);document.getElementById("fuels").innerHTML=keys.map(k=>"<code>"+k+"</code>").join(" &nbsp; ");if(!x)throw new Error("Nessun prezzo Benzina <= "+TARGET);document.getElementById("price").textContent=x.price.toFixed(3)+" €/L";document.getElementById("date").textContent=x.date;document.getElementById("self").textContent=x.self==="1"?"Sì":"No";document.getElementById("cost").textContent=(x.price*LITERS).toLocaleString("it-IT",{style:"currency",currency:"EUR"});st.className="ok";st.textContent="✓ Test completato";diag.textContent=JSON.stringify({url,idFile:data.id,chiavi:keys,selezionato:x,litri:LITERS,costo:x.price*LITERS},null,2)}catch(e){st.className="err";st.textContent="✗ Test fallito";diag.textContent=e.stack||String(e)}}
document.getElementById("run").onclick=run;run();
</script></body></html>
